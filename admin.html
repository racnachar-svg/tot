<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin — ToT Learning Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#07130f">
<style>
:root{
  --ink:#0A1712;
  --panel:#13322B;
  --panel-2:#004C45;
  --line:#2E5A4E;
  --amber:#78BE20;
  --mint:#00C389;
  --coral:#FF6B72;
  --text:#EAF4EF;
  --muted:#93AFA4;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'PT Sans',system-ui,sans-serif;
  line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%, #0F2A22 0%, var(--ink) 55%);
  min-height:100vh;
}
h1,h2,.display{font-family:'Raleway','PT Sans',sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:26px 20px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:4px}
h1{font-size:26px;font-weight:800}
.who{font-size:13px;color:var(--muted)}
.actions-top{display:flex;gap:10px}
.link-btn{
  font-family:inherit;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--text);
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block;
}
.link-btn:hover{border-color:var(--amber)}
.card{background:linear-gradient(165deg,#153A31,#0E2820);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.card h2{font-size:17px;font-weight:800;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 14px;align-items:end}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
input,select{
  width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:14.5px;font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--amber);border-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  padding:11px 18px;border-radius:11px;
  background:linear-gradient(135deg,#8FD433,#6FB318);color:#0B1A05;font-weight:800;font-size:14px;
  transition:filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.small{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn.danger{background:linear-gradient(135deg,#FF8A90,#E44450);color:#2A0508}
.msg{border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(255,107,114,.1);border:1.5px solid var(--coral);color:var(--coral)}
.msg.ok{background:rgba(0,195,137,.12);border:1.5px solid var(--mint);color:var(--mint)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 10px 10px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.pill.admin{background:rgba(120,190,32,.18);color:var(--amber)}
.pill.trainee{background:rgba(147,175,164,.16);color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.edit-fields{display:flex;gap:8px;flex-wrap:wrap;min-width:220px}
.edit-fields input,.edit-fields select{min-width:110px}
.empty{color:var(--muted);font-size:13.5px;padding:14px 4px}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="eyebrow">ToT Associate Diploma</div>
      <h1 class="display">Admin dashboard</h1>
      <div class="who" id="whoami"></div>
    </div>
    <div class="actions-top">
      <a class="link-btn" href="/">← Back to game</a>
      <button class="link-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="card">
    <h2>Create user</h2>
    <form id="createForm">
      <div class="grid">
        <div>
          <label for="c-username">Username</label>
          <input type="text" id="c-username" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        </div>
        <div>
          <label for="c-name">Display name</label>
          <input type="text" id="c-name" autocomplete="off">
        </div>
        <div>
          <label for="c-password">Password</label>
          <input type="password" id="c-password" autocomplete="new-password" required>
        </div>
        <div>
          <label for="c-role">Role</label>
          <select id="c-role">
            <option value="trainee">Trainee</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <button class="btn" type="submit" id="createBtn">Create user</button>
        </div>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Users</h2>
    <div class="tablewrap">
      <table id="usersTable">
        <thead>
          <tr><th>Username</th><th>Display name</th><th>Role</th><th>Created</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyMsg" style="display:none">No users yet.</div>
  </div>
</div>

<script>
let ME = null;
let USERS = [];

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");

function showMsg(text, kind){
  const el = $("#msg");
  el.textContent = text;
  el.className = "msg show " + (kind === "ok" ? "ok" : "err");
}
function clearMsg(){
  const el = $("#msg");
  el.className = "msg";
}

async function api(path, opts){
  const res = await fetch(path, {
    credentials: "same-origin",
    headers: opts && opts.body ? { "Content-Type": "application/json" } : undefined,
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed.");
  return data;
}

async function loadMe(){
  try {
    ME = await api("/api/me");
    $("#whoami").textContent = `Signed in as ${ME.name} (${ME.username})`;
  } catch (e) {
    location.href = "/login.html";
  }
}

async function loadUsers(){
  const data = await api("/api/admin/users");
  USERS = data.users;
  renderUsers();
}

function renderUsers(){
  const body = $("#usersBody");
  body.innerHTML = "";
  $("#emptyMsg").style.display = USERS.length ? "none" : "block";

  USERS.forEach((u) => {
    const tr = document.createElement("tr");
    tr.dataset.id = u.id;
    tr.innerHTML = `
      <td>${esc(u.username)}</td>
      <td class="cell-name">${esc(u.displayName)}</td>
      <td class="cell-role"><span class="pill ${u.role}">${u.role}</span></td>
      <td>${esc((u.createdAt || "").replace("T"," ").slice(0,16))}</td>
      <td>
        <div class="row-actions">
          <button class="btn ghost small" data-act="edit">Edit</button>
          <button class="btn ghost small" data-act="reset">Reset password</button>
          <button class="btn danger small" data-act="delete" ${u.id === ME.id ? "disabled title=\"Can't delete your own account\"" : ""}>Delete</button>
        </div>
      </td>`;
    body.appendChild(tr);
  });
}

function startEdit(tr, user){
  const nameCell = tr.querySelector(".cell-name");
  const roleCell = tr.querySelector(".cell-role");
  const actionsCell = tr.querySelector(".row-actions");

  nameCell.innerHTML = `<input type="text" class="edit-name" value="${esc(user.displayName)}">`;
  roleCell.innerHTML = `
    <select class="edit-role">
      <option value="trainee" ${user.role==="trainee"?"selected":""}>Trainee</option>
      <option value="admin" ${user.role==="admin"?"selected":""}>Admin</option>
    </select>`;
  actionsCell.innerHTML = `
    <button class="btn small" data-act="save">Save</button>
    <button class="btn ghost small" data-act="cancel">Cancel</button>`;
}

async function saveEdit(tr, user){
  const displayName = tr.querySelector(".edit-name").value.trim();
  const role = tr.querySelector(".edit-role").value;
  if (!displayName) return showMsg("Display name cannot be empty.");

  try {
    await api(`/api/admin/users/${user.id}`, {
      method: "PATCH",
      body: JSON.stringify({ displayName, role }),
    });
    clearMsg();
    await loadUsers();
  } catch (e) {
    showMsg(e.message);
  }
}

function startReset(tr, user){
  const actionsCell = tr.querySelector(".row-actions");
  actionsCell.innerHTML = `
    <input type="password" class="reset-pass" placeholder="New password (min 8 chars)" style="max-width:190px">
    <button class="btn small" data-act="save-reset">Save</button>
    <button class="btn ghost small" data-act="cancel">Cancel</button>`;
}

async function saveReset(tr, user){
  const password = tr.querySelector(".reset-pass").value;
  if (password.length < 8) return showMsg("Password must be at least 8 characters.");

  try {
    await api(`/api/admin/users/${user.id}`, {
      method: "PATCH",
      body: JSON.stringify({ password }),
    });
    clearMsg();
    showMsg(`Password reset for "${user.username}".`, "ok");
    await loadUsers();
  } catch (e) {
    showMsg(e.message);
  }
}

async function deleteUser(user){
  if (!confirm(`Delete "${user.username}"? This cannot be undone.`)) return;
  try {
    await api(`/api/admin/users/${user.id}`, { method: "DELETE" });
    clearMsg();
    await loadUsers();
  } catch (e) {
    showMsg(e.message);
  }
}

$("#usersBody").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const tr = e.target.closest("tr");
  const user = USERS.find((u) => u.id === Number(tr.dataset.id));
  if (!user) return;

  const act = btn.dataset.act;
  if (act === "edit") startEdit(tr, user);
  else if (act === "reset") startReset(tr, user);
  else if (act === "save") saveEdit(tr, user);
  else if (act === "save-reset") saveReset(tr, user);
  else if (act === "cancel") renderUsers();
  else if (act === "delete") deleteUser(user);
});

$("#createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();
  const btn = $("#createBtn");
  btn.disabled = true;

  const username = $("#c-username").value.trim();
  const displayName = $("#c-name").value.trim();
  const password = $("#c-password").value;
  const role = $("#c-role").value;

  try {
    await api("/api/admin/users", {
      method: "POST",
      body: JSON.stringify({ username, password, displayName, role }),
    });
    $("#createForm").reset();
    showMsg(`Created "${username}".`, "ok");
    await loadUsers();
  } catch (e2) {
    showMsg(e2.message);
  } finally {
    btn.disabled = false;
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try { await api("/api/logout", { method: "POST" }); } catch (e) {}
  location.href = "/login.html";
});

(async function boot(){
  await loadMe();
  await loadUsers();
})();
</script>
</body>
</html>
