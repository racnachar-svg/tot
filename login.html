<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign in — ToT Learning Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#07130f">
<style>
:root{
  --ink:#0A1712;
  --panel:#13322B;
  --panel-2:#004C45;
  --line:#2E5A4E;
  --amber:#78BE20;
  --mint:#00C389;
  --coral:#FF6B72;
  --text:#EAF4EF;
  --muted:#93AFA4;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'PT Sans',system-ui,sans-serif;
  line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%, #0F2A22 0%, var(--ink) 55%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
h1,.display{font-family:'Raleway','PT Sans',sans-serif}
.card{
  width:100%;max-width:420px;
  background:linear-gradient(165deg,#153A31,#0E2820);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:28px 26px;box-shadow:0 14px 40px rgba(0,0,0,.28);
}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:8px}
h1{font-size:26px;font-weight:800;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
input{
  width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:16px;font-family:inherit;margin-bottom:16px;
}
input:focus{outline:2px solid var(--amber);border-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  display:block;width:100%;padding:15px 18px;border-radius:14px;
  background:linear-gradient(135deg,#8FD433,#6FB318);color:#0B1A05;font-weight:800;font-size:16px;
  transition:transform .08s ease, filter .15s;box-shadow:0 6px 18px rgba(120,190,32,.22);
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;pointer-events:none}
.err{
  display:none;background:rgba(255,107,114,.1);border:1.5px solid var(--coral);color:var(--coral);
  border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;
}
.err.show{display:block}
.hint{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">ToT Associate Diploma</div>
  <h1 class="display">Sign in</h1>
  <p class="sub">Enter the account your facilitator gave you to start the expedition.</p>
  <div class="err" id="err"></div>
  <form id="loginForm" autocomplete="on">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn" id="submitBtn" type="submit">Sign in</button>
  </form>
  <p class="hint">No account? Ask your facilitator to create one for you.<br>On Netlify, enter any trainee name and sign in.</p>
</div>
<script>
const form = document.getElementById("loginForm");
const err = document.getElementById("err");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Signing in…";

  const username = (document.getElementById("username").value || "").trim();
  const password = document.getElementById("password").value;
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Sign in failed.");
    window.location.href = "/index.html";
  } catch (ex) {
    /* Static deploy (Netlify): no /api — accept any name as a local guest. */
    if (!username) {
      err.textContent = "Enter a trainee name to continue.";
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Sign in";
      return;
    }
    try {
      sessionStorage.setItem("tot_auth", JSON.stringify({
        username,
        name: username,
        displayName: username,
        role: "trainee"
      }));
      window.location.href = "/index.html";
      return;
    } catch (e2) {
      err.textContent = ex.message || "Sign in failed.";
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  }
});
</script>
</body>
</html>
