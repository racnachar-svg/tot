<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>From Expert to Educator — ToT Learning Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="From Expert to Educator">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --ink:#0A1712;            /* near-black green night */
  --panel:#13322B;          /* LAU Pantone 627 dark green */
  --panel-2:#004C45;        /* LAU Pantone 3302 */
  --line:#2E5A4E;
  --lau:#006751;            /* LAU official Dark Green — Pantone 336 */
  --amber:#78BE20;          /* LAU Pantone 368 lime — primary accent */
  --amber-deep:#B5BD00;     /* LAU Pantone 390 */
  --mint:#00C389;           /* LAU Pantone 3395 */
  --coral:#FF6B72;          /* functional error red */
  --text:#EAF4EF;
  --muted:#93AFA4;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'PT Sans',system-ui,sans-serif;
  line-height:1.5;
  background-image:radial-gradient(circle at 20% 0%, #0F2A22 0%, var(--ink) 55%);
  min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:20px 18px 60px;min-height:100vh}
h1,h2,h3,.display{font-family:'Raleway','PT Sans',sans-serif}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:6px}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:var(--muted);background:rgba(11,29,23,.55);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px)}
.hud .score{font-family:'Raleway';font-weight:800;font-size:18px;color:var(--amber)}
.hud .streak{color:var(--mint);font-weight:700}
.card{background:linear-gradient(165deg,#153A31,#0E2820);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.card.cine{background:linear-gradient(160deg,#0F3A30 0%,#0B211B 70%);position:relative;overflow:hidden}
.card.cine::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%, rgba(0,195,137,.16), transparent 55%);pointer-events:none}
.video-slot{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.cine-video{width:100%;border-radius:12px;margin-top:14px;display:block;border:1px solid var(--line)}
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  display:block;width:100%;padding:15px 18px;border-radius:14px;
  background:linear-gradient(135deg,#8FD433,#6FB318);color:#0B1A05;font-weight:800;font-size:16px;letter-spacing:.01em;
  transition:transform .08s ease, filter .15s, box-shadow .2s;box-shadow:0 6px 18px rgba(120,190,32,.22);
}
.btn:hover{filter:brightness(1.07)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);font-weight:600}
.btn.mint{background:linear-gradient(135deg,#12D69A,#00A876);color:#00281C;box-shadow:0 6px 18px rgba(0,195,137,.22)}
.btn+.btn{margin-top:10px}
input[type=text]{
  width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:16px;font-family:inherit;margin:14px 0 18px;
}
input[type=text]:focus{outline:2px solid var(--amber);border-color:transparent}

/* Trail map */
.trail{position:relative;padding-left:34px}
.trail::before{
  content:"";position:absolute;left:13px;top:8px;bottom:8px;width:0;
  border-left:2.5px dashed var(--line);
}
.node{position:relative;margin-bottom:14px}
.node .dot{
  position:absolute;left:-34px;top:20px;width:28px;height:28px;border-radius:50%;
  background:var(--panel-2);border:2.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;
}
.node.done .dot{background:var(--mint);border-color:var(--mint);color:#00281C;font-weight:800}
.node.current .dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 6px rgba(120,190,32,.15);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(120,190,32,.12)}50%{box-shadow:0 0 0 10px rgba(120,190,32,.05)}}
.wcard{
  width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;color:var(--text);
}
.node.current .wcard{border-color:var(--amber)}
.node.locked .wcard{opacity:.45}
.wcard .wtitle{font-family:'Raleway';font-weight:800;font-size:17px}
.wcard .wsub{font-size:13px;color:var(--muted);margin-top:2px}
.stars{color:var(--amber);font-size:14px;letter-spacing:2px;margin-top:4px}

/* Challenges */
.qcount{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;letter-spacing:.08em}
.progressbar{height:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px}
.progressbar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .35s ease}
.qtext{font-family:'Raleway';font-weight:700;font-size:20px;line-height:1.35;margin-bottom:8px}
.qstory{font-size:14px;color:var(--muted);margin-bottom:14px;border-left:3px solid var(--amber);padding-left:12px}
.opt{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:13px;
  color:var(--text);font-size:15px;line-height:1.4;transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--amber);transform:translateY(-1px)}
.opt:active{border-color:var(--amber)}
.opt{transition:border-color .15s, background .15s, transform .15s}
.opt.correct{background:rgba(0,195,137,.16);border-color:var(--mint)}
.opt.wrong{background:rgba(255,107,114,.12);border-color:var(--coral)}
.opt.dim{opacity:.5;pointer-events:none}
.tfrow{display:flex;gap:12px}
.tfrow .opt{text-align:center;font-weight:700;font-size:17px}

/* order + match */
.chip{
  display:block;width:100%;text-align:left;padding:12px 15px;margin-bottom:9px;
  background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;color:var(--text);font-size:14.5px;
}
.chip.picked{opacity:.35;pointer-events:none}
.seq{min-height:44px;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.seq .chip{background:var(--panel);border-color:var(--amber);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.seq .chip small{color:var(--muted);font-weight:700}
.seq .empty{color:var(--muted);font-size:13px;text-align:center;padding:6px}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mopt{
  padding:12px 10px;border-radius:12px;background:var(--panel-2);border:1.5px solid var(--line);
  color:var(--text);font-size:13.5px;line-height:1.35;text-align:left;min-height:64px;
}
.mopt.sel{border-color:var(--amber);background:rgba(120,190,32,.12)}
.mopt.l{border-left:3px solid var(--amber)}
.mhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 4px}
.mopt.lock{border-color:var(--mint);background:rgba(0,195,137,.12);opacity:.7;pointer-events:none}
.mopt.flash{border-color:var(--coral);background:rgba(255,107,114,.15)}

/* feedback */
.fb{border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;border:1.5px solid}
.fb.good{background:rgba(0,195,137,.12);border-color:var(--mint)}
.fb.bad{background:rgba(255,107,114,.1);border-color:var(--coral)}
.fb .fbtitle{font-family:'Raleway';font-weight:800;font-size:18px;margin-bottom:6px}
.fb.good .fbtitle{color:var(--mint)}
.fb.bad .fbtitle{color:var(--coral)}
.fb p{font-size:14.5px}
.pts{font-weight:800;color:var(--amber)}

.bigstars{font-size:34px;letter-spacing:6px;color:var(--amber);text-align:center;margin:10px 0}
.center{text-align:center}
.badge{
  display:inline-block;padding:8px 16px;border-radius:99px;border:1.5px solid var(--amber);
  color:var(--amber);font-weight:700;font-size:14px;margin-top:10px;background:rgba(120,190,32,.10)
}
.finalscore{font-family:'Raleway';font-weight:800;font-size:58px;text-align:center;line-height:1.1;background:linear-gradient(90deg,#C5E86C,#00C389);-webkit-background-clip:text;background-clip:text;color:transparent}
.small{font-size:13px;color:var(--muted)}
.mt{margin-top:14px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ================= AMBIENT LIFE ================= */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#CDE8DB;animation:twinkle var(--d,3s) var(--dl,0s) infinite ease-in-out}
.sky i.big{width:3px;height:3px;background:#C5E86C}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.85}}
.app{position:relative;z-index:1}
.fsbtn{position:fixed;top:12px;right:12px;z-index:50;width:40px;height:40px;border-radius:11px;
  background:rgba(24,34,51,.75);border:1px solid var(--line);color:var(--text);font-size:17px;
  backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{animation:rise .45s ease backwards}
.qtext,.qstory{animation:rise .4s ease backwards}
.opt,.chip,.mopt{animation:rise .35s ease backwards}
.opt:nth-of-type(1),.mopt:nth-of-type(1){animation-delay:.04s}
.opt:nth-of-type(2),.mopt:nth-of-type(2){animation-delay:.1s}
.opt:nth-of-type(3),.mopt:nth-of-type(3){animation-delay:.16s}
.opt:nth-of-type(4),.mopt:nth-of-type(4){animation-delay:.22s}
.node{animation:rise .4s ease backwards}
.node:nth-child(2){animation-delay:.06s}.node:nth-child(3){animation-delay:.12s}
.node:nth-child(4){animation-delay:.18s}.node:nth-child(5){animation-delay:.24s}
.btn:not(.ghost){animation:btnGlow 2.8s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 4px 16px rgba(120,190,32,.14)}50%{box-shadow:0 4px 30px rgba(120,190,32,.38)}}
.progressbar i{background:linear-gradient(90deg,var(--amber),#C5E86C,var(--amber));background-size:200% 100%;animation:shimmer 1.8s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.pts{display:inline-block;animation:popIn .5s cubic-bezier(.4,1.9,.5,1) backwards}
@keyframes popIn{from{transform:scale(.2);opacity:0}}
.bigstars{animation:popIn .6s cubic-bezier(.4,1.9,.5,1) .2s backwards}
.fb{animation:rise .35s ease backwards}
.confetti{position:fixed;top:-16px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:cfall var(--t,2.6s) linear forwards}
@keyframes cfall{to{transform:translateY(112vh) rotate(760deg)}}
@media(min-width:900px){.app{max-width:640px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.sky{display:none}}

</style>
<style>
:root{--tle-bg:#07130f;--tle-card:#102820;--tle-card2:#17372e;--tle-gold:#d6f36a;--tle-mint:#5ce0b5;--tle-text:#f4fbf7;--tle-muted:#b8cec5;--tle-line:#31594c;--tle-warn:#ffb86b;--tle-bad:#ff8a8f}
body.tle-mode #veil{display:block!important;background:rgba(4,14,10,.78)!important;backdrop-filter:blur(5px)}
body.tle-mode .app{max-width:980px;padding:22px 18px 64px}
.tle-shell{max-width:920px;margin:0 auto;animation:fade .3s ease}
.tle-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:var(--tle-muted);font-size:13px}
.tle-brand{font-family:Raleway,sans-serif;font-weight:800;letter-spacing:.08em;color:var(--tle-gold)}
.tle-progress{flex:1;max-width:360px;height:7px;background:#173027;border-radius:99px;overflow:hidden;border:1px solid #284a3e}
.tle-progress i,.tle-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--tle-mint),var(--tle-gold));transition:width .35s ease}
.tle-panel{background:linear-gradient(160deg,rgba(16,40,32,.97),rgba(8,25,19,.97));border:1px solid var(--tle-line);border-radius:22px;padding:26px;box-shadow:0 18px 60px rgba(0,0,0,.28);margin-bottom:16px}
.tle-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tle-mint);font-weight:800;margin-bottom:8px}
.tle-title{font:800 clamp(28px,5vw,52px)/1.06 Raleway,sans-serif;color:var(--tle-text);margin:0 0 12px}
.tle-sub{font-size:18px;color:var(--tle-muted);max-width:720px}
.tle-quote{font:600 22px/1.45 Raleway,sans-serif;color:var(--tle-text);border-left:4px solid var(--tle-gold);padding-left:18px;margin:20px 0}
.tle-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.tle-btn{border-radius:14px;padding:13px 18px;background:var(--tle-gold);color:#102000;font-weight:800;font-size:15px;border:0;box-shadow:none;animation:none!important;width:auto;min-width:150px}
.tle-btn.secondary{background:transparent;color:var(--tle-text);border:1px solid var(--tle-line)}
.tle-btn:disabled{opacity:.45;cursor:not-allowed}
.tle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tle-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tle-card{background:var(--tle-card2);border:1px solid var(--tle-line);border-radius:16px;padding:16px;color:var(--tle-text);text-align:left;min-height:112px;animation:none!important;box-shadow:none}
button.tle-card{width:100%;cursor:pointer}
button.tle-card:hover{border-color:var(--tle-mint);transform:translateY(-1px)}
.tle-card.selected{border-color:var(--tle-gold);background:rgba(214,243,106,.10)}
.tle-card.good{border-color:var(--tle-mint);background:rgba(92,224,181,.10)}
.tle-card.bad{border-color:var(--tle-bad);background:rgba(255,138,143,.10)}
.tle-card h3{font:800 18px Raleway,sans-serif;margin:0 0 6px;color:#fff}
.tle-card p{margin:0;color:var(--tle-muted);font-size:14px}
.tle-person{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;min-height:130px}
.tle-avatar{width:52px;height:52px;border-radius:14px;background:#0d2019;display:grid;place-items:center;font-size:28px;border:1px solid var(--tle-line)}
.tle-tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:#0d211a;color:var(--tle-gold);font-size:11px;font-weight:800}
.tle-feedback{border-radius:16px;padding:16px 18px;margin-top:16px;background:rgba(92,224,181,.10);border:1px solid var(--tle-mint);color:var(--tle-text)}
.tle-feedback.warn{background:rgba(255,184,107,.10);border-color:var(--tle-warn)}
.tle-feedback.bad{background:rgba(255,138,143,.10);border-color:var(--tle-bad)}
.tle-note{background:#0b2119;border:1px dashed #3d6758;border-radius:16px;padding:18px;color:var(--tle-muted);margin-top:16px}
.tle-note strong{color:var(--tle-gold)}
.tle-mentor{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:start}
.tle-mentor .face{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:#153429;border:2px solid var(--tle-gold)}
.tle-journal{width:100%;min-height:120px;border-radius:14px;border:1px solid var(--tle-line);background:#091c15;color:var(--tle-text);padding:14px;font:16px/1.5 'PT Sans';resize:vertical}
.tle-concepts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tle-pill{padding:12px;border-radius:14px;background:#0c241b;border:1px solid var(--tle-line);text-align:center;color:var(--tle-muted);font-size:13px}
.tle-pill strong{display:block;color:var(--tle-text);font-family:Raleway;margin-bottom:4px}
.tle-footer{color:var(--tle-muted);font-size:12px;text-align:center;margin-top:18px}
@media(max-width:720px){.tle-grid,.tle-grid.three,.tle-concepts{grid-template-columns:1fr}.tle-panel{padding:20px}.tle-top{align-items:flex-start}.tle-progress{max-width:none}.tle-person{min-height:auto}.tle-title{font-size:34px}}
</style>
<style>
.tna-casebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 18px}.tna-chip{padding:7px 10px;border-radius:99px;background:#0b2119;border:1px solid var(--tle-line);color:var(--tle-muted);font-size:12px}.tna-chip b{color:var(--tle-gold)}
.tna-evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tna-doc{background:#f5f0df;color:#20362f;border-radius:14px;padding:16px;min-height:145px;box-shadow:0 8px 24px rgba(0,0,0,.22);position:relative}.tna-doc:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--tle-mint);border-radius:14px 14px 0 0}.tna-doc h3{font:800 17px Raleway;margin:4px 0 7px}.tna-doc p{font-size:13.5px;line-height:1.45}.tna-doc.locked{filter:grayscale(1);opacity:.48}.tna-doc.selected{outline:3px solid var(--tle-gold)}
.tna-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.tna-meter div{padding:10px;border-radius:12px;text-align:center;background:#0b2119;border:1px solid var(--tle-line);color:var(--tle-muted);font-size:12px}.tna-meter div.on{background:rgba(92,224,181,.12);border-color:var(--tle-mint);color:#fff}
.tna-table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:12px}.tna-table td,.tna-table th{padding:11px;background:#102b22;text-align:left;font-size:13px}.tna-table th{color:var(--tle-gold);font-family:Raleway}.tna-table td:first-child,.tna-table th:first-child{border-radius:10px 0 0 10px}.tna-table td:last-child,.tna-table th:last-child{border-radius:0 10px 10px 0}
.tna-report{background:#f7f3e8;color:#18352b;border-radius:16px;padding:22px}.tna-report h2{font-family:Raleway;margin-bottom:10px}.tna-report h3{font-family:Raleway;margin:16px 0 5px}.tna-report ul{padding-left:20px}.tna-report li{margin:5px 0}.tna-report .stamp{display:inline-block;border:2px solid #168f7d;color:#168f7d;font:800 14px Raleway;padding:8px 12px;transform:rotate(-3deg);margin-top:14px}
@media(max-width:720px){.tna-evidence,.tna-meter{grid-template-columns:1fr}.tna-table{display:block;overflow-x:auto}}
</style>
<style>
/* Module 3 — Curriculum Architect */
.m3-workbench{display:grid;grid-template-columns:1fr 1fr;gap:12px}.m3-slot,.m3-token{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}
.m3-slot{min-height:88px}.m3-token{cursor:pointer;transition:.18s}.m3-token:hover{transform:translateY(-2px);border-color:var(--amber)}.m3-token.selected{border-color:var(--mint);box-shadow:0 0 0 2px rgba(0,195,137,.15)}
.m3-chain{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:6px}.m3-chain .link{min-width:145px;flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.m3-chain .arrow{display:flex;align-items:center;color:var(--amber);font-size:24px}
.m3-objective{background:#08271f;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.m3-builder{display:grid;gap:10px}.m3-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}.m3-label{font-weight:800;color:var(--amber)}
.m3-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m3-stage{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.m3-stage strong{display:block;color:var(--amber);margin-bottom:6px}
.m3-meter{height:12px;background:#08251e;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:8px}.m3-meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--mint));transition:.3s}

@media(max-width:760px){

<script>
/* ================= GAME DATA ================= */
const WORLDS = [
{
  id:"w1", icon:"🧭", title:"Base Camp: The Adult Mind",
  module:"Module 1 — Foundations of Adult Learning",
  intro:"Every great trainer starts here. Before you design anything, you must understand who is sitting in front of you — and adults do not learn like schoolchildren. Clear this camp to earn your compass.",
  challenges:[
{"type":"mcq","q":"Which statement best describes ANDRAGOGY compared with pedagogy?","opts":["Teacher-led and subject-centred, for dependent learners","Self-directed and problem-centred, for learners who apply it now","A faster way to memorise facts","A method reserved for online courses"],"correct":1,"explain":"Andragogy assumes adults are self-directed, problem-centred, draw on rich experience, and are motivated internally."},
{"type":"match","q":"Match each VARK preference to a tactic that serves it well.","cols":["Preference","Tactic"],"pairs":[["Visual","Sketch flows, maps and annotated screenshots"],["Auditory","Think-aloud demos and peer explain-backs"],["Read / Write","Job aids, checklists and brief written reflection"],["Kinesthetic","Do-it-now tasks and simulations on real files"]],"explain":"VARK is four channels, not four types of people. Blend several in every concept."},
{"type":"order","q":"Kolb's experiential cycle drives real learning. Put the four stages in order (start with doing):","items":["Experience — do a task, case or simulation","Reflect — review what happened","Think — draw conclusions and form principles","Act — apply the principle to a new situation"],"explain":"Experience → Reflect → Think → Act, then loop. Each turn ends in a do-it-now task."},
{"type":"tf","q":"True or false?","statement":"Moving from 'sage on the stage' to 'guide on the side' means the trainer sets up problems and lets learners do the thinking.","answer":true,"explain":"True. Facilitation elicits thinking — learners do the work, so the learning sticks."},
{"type":"mcq","q":"According to Knowles, what should a strong session opening always answer FIRST?","opts":["What is the assessment worth?","What's in it for me — why does this matter now?","Who is the most experienced person here?","How many slides are there?"],"correct":1,"explain":"Adults need to know WHY before they invest effort. Lead with relevance."},

    {type:"mcq", q:"Malcolm Knowles made one idea famous. What is 'andragogy'?",
     opts:["The art and science of helping adults learn","A method for testing children in classrooms","A theory about memorising facts faster","A software for building e-learning courses"],
     correct:0, explain:"Andragogy is the art and science of helping adults learn — the foundation of everything a trainer does. Pedagogy, by contrast, refers to teaching children."},
    {type:"mcq", q:"Participants walk in and immediately ask: “Why do we even need this training?” Which adult learning assumption is speaking?",
     opts:["Adults need to know why they are learning something","Adults prefer competition over collaboration","Adults dislike being asked questions","Adults learn best in the morning"],
     correct:0, explain:"Knowles' first assumption: adults need to know WHY before they invest effort. A strong opening always answers 'what's in it for me?'"},
    {type:"tf", q:"True or false?", statement:"Adults learn best when their prior experience is set aside so they can start fresh, like a blank page.",
     answer:false, explain:"False — the opposite. Adult experience is a resource, not an obstacle. Great facilitators pull that experience into the room and build on it."},
    {type:"match", q:"Match each adult learning principle to the facilitation move that honours it.", cols:["Principle","Facilitation move"],
     pairs:[["Self-direction","Let learners choose which case study to work on"],
            ["Rich experience","Pair veterans with newcomers to share stories"],
            ["Problem-centred","Anchor every activity in a real job challenge"],
            ["Readiness to learn","Connect content to what learners face this month"]],
     explain:"Each principle demands a design choice. Self-direction → choice. Experience → peer exchange. Problem-centred → real tasks. Readiness → timely relevance."},
    {type:"tf", q:"True or false?", statement:"Adult learners are mostly problem-centred: they want to solve real situations, not study subjects in the abstract.",
     answer:true, explain:"True. Adults come to fix, improve or handle something real. Design around problems and performance, not around topics."},
    {type:"mcq", boss:true, q:"⚔️ CAMP CHALLENGE — Twenty minutes into your lecture, half the room is on their phones. What is the strongest recovery?",
     story:"You are delivering a session on report writing to experienced field officers.",
     opts:["Speak louder and add more slides so they refocus","Switch to a short pair task where they apply the content to their own reports","Take a coffee break and continue the same lecture after","Politely ask them to put phones away and keep lecturing"],
     correct:1, explain:"Disengagement is a design signal, not a discipline problem. Shifting to application — their reports, their reality — re-activates relevance, experience and problem-centred learning all at once."}
  ]
},
{
  id:"w2", icon:"🔍", title:"The Case of the Falling KPIs",
  module:"Module 2 — Training Needs Assessment",
  intro:"CallCo's customer satisfaction score has dropped 18% in one quarter. Management demands: “Just run a training!” But you are a TNA detective — you investigate before you prescribe. Gather the clues. Find the real gap.",
  challenges:[
{"type":"mcq","q":"In the ADDIE cycle, where does the TNA live?","opts":["Design","Analyse","Implement","Evaluate"],"correct":1,"explain":"TNA opens ADDIE at the Analyse stage."},
{"type":"match","q":"Match each of the four TYPES of need to its example.","cols":["Type of need","Example"],"pairs":[["Normative","Measured against a standard: CRM logging below benchmark"],["Felt","What people say they want: help with angry customers"],["Expressed","Felt need turned into demand: a waiting list forms"],["Comparative","Gap between groups: Tier-2 resolves 80%, Tier-1 only 55%"]],"explain":"Normative = vs standard. Felt = what they say. Expressed = demand. Comparative = between groups."},
{"type":"mcq","q":"A complete TNA reads the gap from three heights. Which question is the ORGANISATIONAL level?","opts":["Which specific people have the gap?","What does the job require, step by step?","Where is the business going, and what capabilities must exist?","Which slide template should we use?"],"correct":2,"explain":"Organisational = strategy and capability; task = job demands; individual = who has the gap."},
{"type":"tf","q":"True or false?","statement":"A training request from management is itself a diagnosis of the real need.","answer":false,"explain":"False. A request is not a diagnosis. Test whether the gap is skill/knowledge or something else."},
{"type":"order","q":"Use the interview FUNNEL technique. Put the four moves in order:","items":["Open wide — 'Tell me about a normal shift.'","Narrow — 'Where does it usually get difficult?'","Probe — 'What have you tried? What happened?'","Confirm — 'So the main barrier is… have I understood?'"],"explain":"Open → Narrow → Probe → Confirm."},
{"type":"match","q":"Match each TNA method to what it does best.","cols":["Method","Strength"],"pairs":[["Survey","Breadth — many people fast"],["Interview","Depth — reasoning a box can't capture"],["Observation","Reveals 'said' vs 'done'"],["Document review","Cheap evidence you already hold"]],"explain":"Triangulate: surveys for breadth, interviews/observation for depth, documents for evidence."},
{"type":"mcq","q":"On the influence/interest map, the CX director and operations manager sit in 'high influence + high interest'. How treat them?","opts":["Monitor lightly","Keep informed only","Manage closely — co-design with them","Ignore until the report is done"],"correct":2,"explain":"High/high = manage closely. High influence = keep satisfied. High interest = keep informed. Low/low = monitor."},

    {type:"mcq", q:"Management says: “The agents need a customer service training. Book it for next week.” What is your FIRST move as a TNA detective?",
     opts:["Book the trainer — the client knows their needs best","Clarify the performance gap: what should be happening vs what is actually happening","Design a fun icebreaker to boost team morale","Send everyone an e-learning module immediately"],
     correct:1, explain:"A request is not a diagnosis. TNA always starts by defining the gap between desired and actual performance — training is only ONE possible cure."},
    {type:"mcq", q:"🗂️ CLUE 1 — An agent tells you in an interview: “We know the refund policy by heart. But the system needs 9 clicks to process one refund while the customer waits.” What does this clue suggest?",
     opts:["A knowledge gap — they need policy training","A process/environment problem — training will not fix it","A motivation problem — they don't care enough","Nothing — one interview is meaningless"],
     correct:1, explain:"They KNOW the policy — knowledge is fine. The 9-click system is an environmental barrier. Training agents harder will not remove clicks. Detectives separate can't-do from blocked-from-doing."},
    {type:"mcq", q:"🎧 CLUE 2 — You listen to 15 recorded calls. Agents frequently interrupt customers and skip empathy statements, even though the greeting script sits on every desk. What kind of gap is this?",
     opts:["A skill and behaviour gap — coachable and trainable","A salary problem","An equipment problem","A staffing shortage"],
     correct:0, explain:"They have the script (knowledge available) but don't perform the behaviour. Skill/behaviour gaps respond well to practice-based training and coaching — this clue IS trainable."},
    {type:"mcq", q:"You suspect the empathy gap affects all 60 agents, not just the 15 calls you heard. What is the best method to confirm it at scale?",
     opts:["Ask the team leader for a general impression","Structured call observations using a behaviour checklist","A survey asking agents 'are you empathetic?'","Wait another quarter and re-check the KPI"],
     correct:1, explain:"Structured observation with a checklist gives objective, comparable behaviour data. Self-report surveys measure perception, not performance — people rarely rate their own empathy poorly."},
    {type:"order", q:"Reconstruct the TNA process. Put the steps in the correct order (tap them in sequence):",
     items:["Define the desired performance","Measure the actual performance","Identify the gap","Analyse the root causes","Recommend solutions (training and non-training)"],
     explain:"Desired → Actual → Gap → Causes → Solutions. If you jump to solutions first, you're not a detective — you're a salesperson."},
    {type:"mcq", boss:true, q:"⚔️ CASE CLOSED? — You present to CallCo's management. Based on ALL your clues, what do you recommend?",
     story:"Clue 1: refund system needs 9 clicks (process barrier). Clue 2: agents skip empathy behaviours (skill gap).",
     opts:["A 3-day customer service training for all agents — training solves everything","Fix the refund system only — no training needed at all","A blended response: simplify the refund process (non-training) + empathy skills coaching with practice (training)","Replace the lowest-performing agents"],
     correct:2, explain:"The professional answer is blended: remove the environmental barrier AND close the skill gap. Recommending non-training solutions is what makes clients trust your TNA — you're solving the problem, not selling a workshop."}
  ]
},
{
  id:"w3", icon:"📐", title:"The Architect's Tower",
  module:"Module 3 — Curriculum & Session Design",
  intro:"A session is a building: objectives are the foundation, sequence is the structure, methods are the rooms people live in. Build it wrong and it collapses in front of a live audience. Grab your blueprints.",
  challenges:[
{"type":"mcq","q":"Competency = Knowledge + Skill + Attitude. Which is a real COMPETENCY, not a topic?","opts":["Understands the theory of active listening","Can de-escalate an angry customer on a live call","Knows the principles of adult learning","Is aware of copyright rules"],"correct":1,"explain":"If you can't picture a learner DOING it, it's a topic."},
{"type":"order","q":"Design BACKWARDS. Put the three steps in order:","items":["Define the outcome — what should learners do?","Decide the evidence — how will they show it?","Plan the learning — choose content and activities"],"explain":"Outcome → Evidence → Learning."},
{"type":"order","q":"The Alignment Chain. Put the links in order:","items":["Need — the gap to close","Competency — what they'll do","Objective — the learning target","Method — how you'll teach it","Assessment — how you'll check it"],"explain":"Need → Competency → Objective → Method → Assessment."},
{"type":"tf","q":"True or false?","statement":"A goal is measurable on its own, just like an objective.","answer":false,"explain":"False. A goal is broad; an objective is specific and observable."},
{"type":"match","q":"Match each verb to the level of thinking.","cols":["Verb","Level"],"pairs":[["Design / develop","Create"],["Critique / justify","Evaluate"],["Compare / examine","Analyse"],["Demonstrate / use","Apply"]],"explain":"The verb must be observable. Avoid 'understand' and 'know'."},

    {type:"order", q:"Stack Bloom's taxonomy from the ground floor up — lowest level first:",
     items:["Remember","Understand","Apply","Analyse","Evaluate","Create"],
     explain:"Remember → Understand → Apply → Analyse → Evaluate → Create. Your objective's verb tells you which floor you're building — and which methods and assessments the session needs."},
    {type:"mcq", q:"Which of these is a well-formed learning objective?",
     opts:["Participants will know about communication","The trainer will present the SMART framework","By the end of the session, participants will be able to write three SMART objectives without support","Participants will appreciate the importance of objectives"],
     correct:2, explain:"It names the performer, an observable verb (write), a condition (by end of session, without support) and a measurable standard (three). 'Know' and 'appreciate' cannot be observed — you can't see someone knowing."},
    {type:"order", q:"Sequence a 90-minute session so it actually works. Tap the blocks in order:",
     items:["Hook: open with a real problem","Share the session objectives","Present new content in short segments","Guided practice on a realistic task","Feedback and correction","Summary and commitment to action"],
     explain:"Hook → Objectives → Content → Practice → Feedback → Close. Notice practice sits in the middle with real time — not squeezed into the last five minutes."},
    {type:"match", q:"Match each objective level to the assessment that can actually measure it.", cols:["Objective level","Assessment"],
     pairs:[["Remember key terms","Quick quiz or recall game"],
            ["Apply a technique","Role-play or hands-on task"],
            ["Evaluate quality","Critique a sample against criteria"],
            ["Create something new","Design a mini-session or product"]],
     explain:"Assessment must match the objective's altitude. A quiz can't measure 'apply' — only performance can. Misaligned assessment is the most common design flaw in real curricula."},
    {type:"mcq", boss:true, q:"⚔️ INSPECTION TIME — You review a colleague's session plan. Objective: 'Participants will be able to APPLY active listening techniques.' Method: a 60-minute lecture with 40 slides, no activities. What's the structural flaw?",
     story:"The colleague insists: 'But my slides are beautiful and my content is complete.'",
     opts:["The slides need better colours","Misalignment: an 'apply' objective demands practice, but the method is pure transmission","The session is too short","The objective is too easy"],
     correct:1, explain:"Alignment is everything: objective, method and assessment must sit on the same Bloom's floor. You cannot lecture people into a skill. Beautiful slides don't rescue a misaligned design."}
  ]

{
  id:"w4", icon:"🧰", title:"The Toolsmith's Workshop",
  module:"Module 4 — Training Materials & Tools",
  intro:"The final craft: turning solid design into materials people actually learn from. In this workshop, less is a weapon, and every tool must earn its place in your kit.",
  challenges:[
{"type":"tf","q":"True or false?","statement":"If an image is found online with no © symbol, it is free to use.","answer":false,"explain":"False. Assume it's protected. Use licensed sources and credit."},
{"type":"mcq","q":"Safest way to use someone else's work in your materials?","opts":["Use anything without a © symbol","Assume it's protected, use licensed sources, and credit it","Screenshot it so the source is hidden","Only worry about copyright for videos"],"correct":1,"explain":"Assume protection, prefer licensed sources, always attribute."},
{"type":"mcq","q":"A handout for a mixed group, some on a phone. What works for EVERYONE?","opts":["Small font to fit more text","Big text, strong contrast, plain words, works on paper and phone","Long paragraphs in a decorative font","Light grey text on white"],"correct":1,"explain":"Accessible = big text, contrast, plain words, works anywhere."},
{"type":"tf","q":"True or false?","statement":"'One idea per page' with white space beats a page packed with text.","answer":true,"explain":"True. Clean wins: the eye knows where to look."},
{"type":"match","q":"Match each materials principle to its design move.","cols":["Principle","Move"],"pairs":[["Make it clear","One idea per page, few words"],["Make it work for everyone","Big text, contrast, plain language"],["Respect others' work","Licensed sources and credit"],["Survive the room","Low-tech backup without a projector"]],"explain":"Clear + accessible + copyright-respecting + resilient."},

    {type:"mcq", q:"Two slides present the same point. Slide A: one strong image + a 6-word headline. Slide B: 9 bullet points in full sentences, size 14 font. Which is stronger for learning, and why?",
     opts:["Slide B — more information means more learning","Slide A — one clear message reduces cognitive load and keeps attention on YOU","Slide B — participants can photograph it","They are equal — design doesn't matter"],
     correct:1, explain:"A slide is a billboard, not a document. One message per slide, minimal text, strong visual. If everything is on the slide, why are you in the room? Detailed content belongs in the handout."},
    {type:"match", q:"Match each tool to the job it does best.", cols:["Tool","Best use"],
     pairs:[["Flipchart","Capture the group's ideas live and keep them visible"],
            ["Handout","Detailed reference participants use after the session"],
            ["Quick poll / show of hands","Instant check of the whole room's position"],
            ["Short video","Show a behaviour model participants can analyse"]],
     explain:"Every tool has one superpower. Trouble starts when tools do the wrong job — like a handout copied onto slides, or a video used to fill time."},
    {type:"tf", q:"True or false?", statement:"Putting full sentences on slides helps participants remember more, because they can read and listen at the same time.",
     answer:false, explain:"False — reading and listening compete for the same mental channel (redundancy effect). Participants either read you or hear you, and usually do both badly. Keywords on screen, full sentences from your mouth."},
    {type:"mcq", q:"You're training 18 women in a rural venue. Ten minutes before the session, the electricity cuts and there is no generator. Your entire session was slide-based. The professional response?",

     correct:2, explain:"A trainer's materials kit must survive a power cut. If your session dies with the projector, the projector was the trainer. Low-tech adaptations aren't a downgrade — in many contexts they're the main plan."},

     opts:["A 60-slide deck and a 20-page text handout","Visual-first slides as backup, illustrated activity cards, flipchart templates, and a one-page pictorial job aid","Three educational videos and a link to an online quiz","No materials — pure discussion for six hours"],
     correct:1, explain:"Mixed literacy → visual-first everything. Unreliable projector → the session runs from cards and flipcharts, slides are a bonus. A pictorial job aid keeps working weeks after you leave. That's a professional kit."}

{"id":"w5","icon":"🎤","title":"The Grand Stage","module":"Module 5 — Facilitation Skills","intro":"The lights are up and the room is yours — but a great facilitator is a guide, not a performer. The real skill is making OTHERS do the thinking, out loud, together. Step onto the stage and earn the microphone.","challenges":[{"type":"mcq","q":"Which move most reliably turns a passive room into an active one?","opts":["Talk faster to cover more ground","Ask an open question, then hold the silence and wait","Add more slides so nobody is bored","Promise a longer coffee break"],"correct":1,"explain":"Open question + wait time is the core tool. Silence is where thinking happens."},{"type":"tf","q":"True or false?","statement":"The best facilitators talk the most and fill every silence.","answer":false,"explain":"False. If you talk most of the time, learners aren't doing the work."},{"type":"match","q":"Match each facilitation technique to its purpose.","cols":["Technique","Purpose"],"pairs":[["Open question","Draw out thinking rather than a yes/no"],["Wait time","Give learners space to process"],["Paraphrase","Show you listened and check understanding"],["Think-pair-share","Include quiet voices before the whole room"]],"explain":"Together these move a session from broadcast to conversation."},{"type":"mcq","q":"One participant keeps dominating discussion. Strongest response?","opts":["Publicly tell them to stop","Thank them, then structure turn-taking — 'let's hear from someone new'","Let them continue","Cancel the discussion and lecture"],"correct":1,"explain":"Redirect without shaming; use structure to open space for others."},{"type":"mcq","q":"A quiet participant has ideas but never speaks up. What draws them in?","opts":["Put them on the spot","Start with think-pair-share so they build confidence first","Ignore them","Ask everyone to raise a hand"],"correct":1,"explain":"Lower the risk before raising the stakes."},{"type":"tf","q":"True or false?","statement":"Closed (yes/no) questions are best for sparking rich discussion.","answer":false,"explain":"False. Open questions invite reasoning."},{"type":"order","q":"A question you can't answer. Sequence the response:","items":["Acknowledge honestly — 'good question, I'm not certain'","Redirect to the group","Park it visibly if unresolved","Follow up afterwards with a real answer"],"explain":"Acknowledge → redirect → park → follow up."},{"type":"mcq","boss":true,"q":"⚔️ HOLD THE ROOM — Mid-afternoon, energy crashed, phones out, an hour left. What do you do?","story":"A full-day session for experienced volunteers.","opts":["Push through the slides faster","Switch to a short, relevant application task in pairs, then debrief","Announce that people must focus","Skip to the end"],"correct":1,"explain":"Disengagement is a design signal. A relevant active task re-fires attention."}]},
{"id":"w6","icon":"⚖️","title":"The Round Table","module":"Module 6 — Inclusive & Ethical Practices","intro":"At this table, no seat is better than another. Inclusive training isn't a ramp bolted on at the end — it's designed in from the first line. Prove you can build a room where everyone belongs, and everyone can learn.","challenges":[{"type":"mcq","q":"What does INCLUSIVE design mean in practice?","opts":["Adding accommodations only when asked","Designing from the start so the widest range of learners can take part","Lowering the standard so all pass","Separating learners by ability"],"correct":1,"explain":"Inclusion is built in, not bolted on."},{"type":"tf","q":"True or false?","statement":"Treating every learner exactly the same always guarantees fairness.","answer":false,"explain":"False. Equality and equity differ; fairness sometimes means different support."},{"type":"match","q":"Match each barrier to an inclusive response.","cols":["Barrier","Response"],"pairs":[["Low vision","High contrast, large text, describe visuals"],["Second-language learners","Plain language, glossary, no idioms"],["Mobility needs","Accessible venue and flexible seating"],["Cultural distance","Varied examples, not one culture's only"]],"explain":"Each barrier has a practical, low-cost fix."},{"type":"mcq","q":"A participant discloses they are being harmed. First responsibility?","opts":["Promise total secrecy forever","Follow the safeguarding protocol — ensure safety and report properly","Investigate it yourself at the break","Ignore it"],"correct":1,"explain":"Safeguarding before content; don't promise confidentiality you can't keep."},{"type":"tf","q":"True or false?","statement":"Using examples from only one culture is fine if it's the majority.","answer":false,"explain":"False. Varied examples help more learners see themselves."},{"type":"mcq","q":"Which reflects GENDER-RESPONSIVE facilitation?","opts":["Assume men prefer technical, women prefer discussion","Ensure equal airtime and stereotype-free examples","Call on men first","Avoid the topic"],"correct":1,"explain":"Equal participation and stereotype-free content."},{"type":"mcq","boss":true,"q":"⚔️ EVERYONE AT THE TABLE — Mixed languages, abilities, cultures. Which approach is genuinely inclusive?","story":"Tight budget, short prep.","opts":["Standard deck, help only if someone struggles","Plain language, varied examples, multiple ways to participate, accessible materials","Split the group by language","Simplify so no one is challenged"],"correct":1,"explain":"Universal design up front beats individual fixes, without lowering the challenge."}]},
{"id":"w7","icon":"🎛️","title":"The Storm Deck","module":"Module 7 — Managing the Training Environment","intro":"Latecomers, a dead projector, a room like an oven, and one participant determined to derail you — all before the first break. A calm trainer keeps the ship steady in any weather. Take the helm.","challenges":[{"type":"mcq","q":"Best moment to establish ground rules?","opts":["After the first problem","At the very start, co-created with the group","At the end","Never"],"correct":1,"explain":"Set expectations early and together."},{"type":"mcq","q":"Running 20 minutes behind. Cut FIRST?","opts":["The hands-on practice","Some presented content, protecting the practice","The breaks","The objectives"],"correct":1,"explain":"Protect the practice — that's where competence is built."},{"type":"tf","q":"True or false?","statement":"A U-shape or clustered tables encourage more interaction than rows.","answer":true,"explain":"True. Layout shapes behaviour."},{"type":"match","q":"Match each disruption to a calm response.","cols":["Disruption","Response"],"pairs":[["Side conversations","Move closer / pause and refocus"],["A latecomer","Keep going; brief them at the break"],["Projector dies","Switch to your low-tech backup"],["Off-topic tangent","Capture it on the 'parking lot'"]],"explain":"Proportionate, low-drama fixes."},{"type":"order","q":"Open a session so the room feels safe. In order:","items":["Welcome and connect","State the purpose and what's in it for them","Agree ground rules together","Start with a low-risk first task"],"explain":"Welcome → Purpose → Ground rules → Easy task."},{"type":"tf","q":"True or false?","statement":"Breaks, temperature, seating and timing have little effect on learning.","answer":false,"explain":"False. A hot room with no breaks destroys attention."},{"type":"mcq","boss":true,"q":"⚔️ WEATHER THE STORM — Late start, hot room, an interrupter, behind schedule. Priority order?","story":"Full-day agenda, no co-facilitator.","opts":["Speed through content, ignore the room","Stabilise the environment, redirect the disruptor calmly, then re-time to protect practice","Cancel the practice","Confront the participant publicly"],"correct":1,"explain":"Steady the ship: conditions, then behaviour, then plan."}]},
{"id":"w8","icon":"🤖","title":"The Machine Room","module":"Module 8 — Leveraging AI Tools for Training","intro":"Down in the engine room, AI can draft, translate, personalise and speed you up — but it's a co-pilot, never the autopilot. The trainer stays responsible for truth, fairness and judgement. Learn to drive it well.","challenges":[{"type":"mcq","q":"Most responsible way to use AI when building content?","opts":["Publish whatever it produces","Draft a first pass, then verify, adapt and refine yourself","Only use it for the final version","Let it decide the objectives"],"correct":1,"explain":"AI accelerates the draft; you own the result."},{"type":"tf","q":"True or false?","statement":"AI facts can be used without checking because the model is usually accurate.","answer":false,"explain":"False. Models hallucinate; always verify against a reliable source."},{"type":"match","q":"Match each AI use to its task.","cols":["AI use","Task"],"pairs":[["Content generation","Draft quiz questions and scenarios"],["Personalisation","Adjust difficulty to the learner"],["Translation","Widen access to more learners"],["Feedback synthesis","Summarise patterns across responses"]],"explain":"A fast first drafter; the human checks accuracy."},{"type":"mcq","q":"Personalising with learner data — the ethical requirement?","opts":["Collect everything","Get consent, minimise and protect the data, follow policy","Store it publicly","Share it with anyone"],"correct":1,"explain":"Transparent, minimal, anonymised, compliant."},{"type":"tf","q":"True or false?","statement":"With good enough AI, the human trainer can be fully replaced.","answer":false,"explain":"False. Facilitation, judgement, empathy and ethics stay human."},{"type":"mcq","q":"'Adaptive learning' mainly means…","opts":["Every learner gets the same fixed path","The path or difficulty adjusts to each learner","Learning only on an app","Replacing all assessment with games"],"correct":1,"explain":"It adjusts to the individual."},{"type":"mcq","boss":true,"q":"⚔️ RESPONSIBLE AUTOPILOT — Two days to build a course with AI. Which workflow is efficient AND responsible?","story":"Accuracy matters.","opts":["Generate it all and ship as-is","Draft with AI → verify facts → adapt to context → human review → credit sources","Only AI images","Let AI mark learners with no oversight"],"correct":1,"explain":"Draft, verify, adapt, review, attribute."}]},
{"id":"w9","icon":"🖥️","title":"The Signal Tower","module":"Module 9 — Online Training Delivery & Management","intro":"Through the screen, attention is fragile and distractions are one click away. The online trainer wins by designing for interaction, not by pointing a camera at a lecture. Light up the signal and keep them with you.","challenges":[{"type":"mcq","q":"Biggest challenge of live online delivery — and its fix?","opts":["Bad microphones — buy hardware","Fading attention — build in interaction every few minutes","Too few slides — add content","Cameras off — force them on"],"correct":1,"explain":"Attention drifts fast; the remedy is frequent interaction."},{"type":"tf","q":"True or false?","statement":"A good online session is the same lecture, on camera.","answer":false,"explain":"False. Online needs shorter segments and activities built for the medium."},{"type":"match","q":"Match each online tool to what it does best.","cols":["Tool","Best use"],"pairs":[["Poll","Instant read of the group"],["Breakout rooms","Small-group practice"],["Chat","Parallel input from everyone"],["Shared document","Live co-creation"]],"explain":"Each feature has a superpower; don't use it to fill time."},{"type":"mcq","q":"A learner needs to work flexibly, on their own schedule. Which mode?","opts":["Synchronous — everyone live","Asynchronous — self-paced with recordings and tasks","Neither works online","Only in-person"],"correct":1,"explain":"Async = self-paced; sync = real time; blended = both."},{"type":"tf","q":"True or false?","statement":"Blended learning combines online and face-to-face in one program.","answer":true,"explain":"True. It mixes modalities deliberately."},{"type":"order","q":"Run an online breakout that works. In order:","items":["Give a clear task and time limit before splitting","Assign groups and open the rooms","Visit rooms to monitor and nudge","Bring everyone back and debrief"],"explain":"Task+time → assign → monitor → debrief."},{"type":"mcq","boss":true,"q":"⚔️ KEEP THE SIGNAL STRONG — 2-hour online session, 30 people, cameras off. What wins?","story":"Several join from home.","opts":["One long screen-share","Short segments broken by polls, chat and breakouts, with clear tasks and breaks","A silent reading session","Talk continuously"],"correct":1,"explain":"Chunk it and interact; breaks fight fatigue."}]},
{"id":"w10","icon":"📊","title":"The Proving Grounds","module":"Module 10 — Assessment & Evaluation","intro":"Smiles at the end of a workshop prove nothing. Did they learn? Did they change what they do? Did it move the business? On the Proving Grounds you gather the evidence that turns 'they seemed happy' into 'it worked'.","challenges":[{"type":"order","q":"Put Kirkpatrick's four levels in order (level 1 first):","items":["Reaction — did they find it useful?","Learning — did knowledge or skill increase?","Behaviour — are they applying it on the job?","Results — did it move the business outcome?"],"explain":"Reaction → Learning → Behaviour → Results."},{"type":"match","q":"Match each Kirkpatrick level to what it measures.","cols":["Level","Measures"],"pairs":[["Reaction","Satisfaction (the 'happy sheet')"],["Learning","Knowledge or skill gain"],["Behaviour","On-the-job application later"],["Results","Impact on the business metric"]],"explain":"L1 weakest evidence; L3–4 what sponsors care about."},{"type":"mcq","q":"A quick check mid-session to adjust pace is what kind of assessment?","opts":["Summative","Formative","Neither","A reaction survey"],"correct":1,"explain":"Formative steers learning in progress."},{"type":"tf","q":"True or false?","statement":"A high 'happy sheet' score proves real learning took place.","answer":false,"explain":"False. Reaction measures feelings, not learning. Need L2–4."},{"type":"mcq","q":"What is a rubric FOR?","opts":["To make marking feel official","To judge performance consistently against clear criteria","To raise everyone's scores","To replace objectives"],"correct":1,"explain":"Criteria stated in advance — fair, consistent, transparent."},{"type":"tf","q":"True or false?","statement":"An assessment should measure at the same level as the objective.","answer":true,"explain":"True. An 'apply' objective needs a performance task."},{"type":"mcq","boss":true,"q":"⚔️ DID IT WORK? — A sponsor asks if the training worked. Strongest evidence?","story":"You have happy sheets, a pre/post test, and manager reports of change.","opts":["The high satisfaction scores alone","Behaviour change on the job plus business results, backed by learning gain","That attendance was full","That the slides looked professional"],"correct":1,"explain":"Lead with behaviour (L3) and results (L4), supported by learning (L2)."}]},
{"id":"w11","icon":"🏔️","title":"The Summit — Final Trial","module":"Module 11 — Practicum (Micro-Teaching)","intro":"Everything converges here: design, delivery and evaluation in one real session. You plan it, you deliver it, you take the feedback, and you improve. This is where a subject expert finally becomes an impactful educator. Climb.","challenges":[{"type":"mcq","q":"The real purpose of micro-teaching?","opts":["To fill remaining hours","To practise a full session and get structured feedback safely","To test who is most confident","To memorise theory again"],"correct":1,"explain":"Deliberate practice: deliver, feedback, reflect, improve."},{"type":"tf","q":"True or false?","statement":"Useful feedback focuses only on what went wrong.","answer":false,"explain":"False. Balanced, specific and actionable — what worked and what to change."},{"type":"match","q":"Match each feedback principle to an example.","cols":["Principle","Example"],"pairs":[["Specific","'Your opening question sparked three responses'"],["Balanced","A strength and a concrete area to improve"],["Actionable","One change to apply next time"],["Kind and timely","Given soon, in a way they can hear"]],"explain":"Feedback works when the receiver can act on it."},{"type":"order","q":"The reflective improvement cycle. In order:","items":["Deliver the session","Gather feedback","Reflect on what happened and why","Identify one or two improvements","Apply them next time"],"explain":"Deliver → Feedback → Reflect → Improve → Apply."},{"type":"mcq","q":"Tough, critical feedback from an instructor. Professional response?","opts":["Defend every choice","Listen, resist defending, and extract the lesson","Ignore it","Argue until they change their mind"],"correct":1,"explain":"Listen first; turn it into an improvement."},{"type":"tf","q":"True or false?","statement":"If a session went well, reflecting afterwards is optional.","answer":false,"explain":"False. Reflection matters most when it works — learn WHY."},{"type":"mcq","q":"The strongest sign you succeeded as a trainer?","opts":["You performed confidently and on time","The learners can now DO what the objective required","Your slides were beautiful","Everyone enjoyed it"],"correct":1,"explain":"Judged by learner performance, not trainer performance."},{"type":"mcq","boss":true,"q":"⚔️ THE FINAL TRIAL — Plan, deliver and evaluate a full session. The true mark of mastery?","story":"The summit of the whole diploma.","opts":["Speaking without notes","A clear line from need → objective → method → assessment, learners who perform, and honest reflection","Using every tool once","Finishing exactly on the minute"],"correct":1,"explain":"Alignment plus impact plus reflection. The impactful educator."}]}
];

  icon:"💡", title:"The Design Lab Lighthouse",

    {q:"Which agenda structure does your objective demand?",

    {q:"Several participants have low confidence in writing. Which method choice supports them best?",

<script>

/* ---------- ambient life ---------- */
function buildSky(){
  const sky=document.createElement("div"); sky.className="sky";
  for(let i=0;i<46;i++){
    const s=document.createElement("i");
    if(Math.random()<.2) s.className="big";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.setProperty("--d",(2+Math.random()*3.5)+"s");
    s.style.setProperty("--dl",(Math.random()*3)+"s");
    sky.appendChild(s);
  }
  document.body.prepend(sky);
}
function buildFsBtn(){
  const b=document.createElement("button"); b.className="fsbtn"; b.textContent="⛶";
  b.title="Full screen";
  b.onclick=()=>{
    if(document.fullscreenElement){ document.exitFullscreen(); b.textContent="⛶"; }
    else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); b.textContent="✕"; }
  };
  document.addEventListener("fullscreenchange",()=>{ b.textContent=document.fullscreenElement?"✕":"⛶"; });
  document.body.appendChild(b);
}
function confetti(n){
  const colors=["#78BE20","#00C389","#B5BD00","#C5E86C","#006751"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];
    c.style.setProperty("--t",(2+Math.random()*2)+"s");
    c.style.animationDelay=(Math.random()*.7)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}
const S = {
  name:"", score:0, streak:0, best:0,

}
function render(html){ app.innerHTML = html; app.firstElementChild && app.firstElementChild.classList.add("fade"); window.scrollTo(0,0); }

function startScreen(){
  render(`
  <div>

function beginGame(){
  const v = document.getElementById("pname").value.trim();
  S.name = v || "Trainee";
  S.phase="map"; mapScreen();
}

function mapScreen(){
  const nodes = WORLDS.map((w,i)=>{
    const state = i < S.worldIdx ? "done" : (i===S.worldIdx ? "current" : "locked");
    const stars = S.stars[i] ? "★".repeat(S.stars[i]) + "☆".repeat(3-S.stars[i]) : "";
    const dot = state==="done" ? "✓" : w.icon;
    const click = state==="current" ? `onclick="enterWorld(${i})"` : "";
    return `<div class="node ${state}">
      <div class="dot">${dot}</div>
      <button class="wcard" ${click}>
        <div class="wtitle">${w.title}</div>
        <div class="wsub">${w.module}</div>
        ${stars?`<div class="stars">${stars}</div>`:""}
        ${state==="current"?`<div class="small mt" style="color:var(--amber);font-weight:700">▶ Tap to enter</div>`:""}
        ${state==="locked"?`<div class="small mt">🔒 Locked</div>`:""}
      </button>
    </div>`;
  }).join("");
  const finDone = S.phase==="end";
  const finState = S.worldIdx>=WORLDS.length ? (finDone?"done":"current") : "locked";
  const finClick = finState==="current" ? `onclick="enterFinale()"` : "";
  render(`
  <div>
    ${hud()}
    <div class="eyebrow">Expedition map</div>
    <h2 style="font-size:24px;font-weight:800;margin-bottom:18px">Phase 1 Trail</h2>
    <div class="trail">
      ${nodes}
      <div class="node ${finState}">
        <div class="dot">${finState==="done"?"✓":FINALE.icon}</div>
        <button class="wcard" ${finClick}>
          <div class="wtitle">${FINALE.title}</div>
          <div class="wsub">Final Boss — everything combined</div>
          ${finState==="current"?`<div class="small mt" style="color:var(--amber);font-weight:700">▶ Tap to enter</div>`:""}
          ${finState==="locked"?`<div class="small mt">🔒 Clear all eleven worlds</div>`:""}
        </button>
      </div>
    </div>
  </div>`);
}

function enterWorld(i){
  S.worldIdx=i; S.chIdx=0;
  S.worldScores[i]=0; S.worldMax[i]=WORLDS[i].challenges.reduce((a,c)=>a+maxPts(c),0);
  const w=WORLDS[i];
  render(`
  <div>
    ${hud()}
    <div class="card cine">
      <div style="font-size:40px">${w.icon}</div>
      <div class="eyebrow">${w.module}</div>
      <h2 style="font-size:26px;font-weight:800">${w.title}</h2>
      <p class="mt" style="color:var(--muted)">${w.intro}</p>
      ${cine(VID[w.id])}
    </div>
    <button class="btn" onclick="playChallenge()">Start · ${w.challenges.length} challenges</button>
    <button class="btn ghost" onclick="mapScreen()">← Back to map</button>
  </div>`);
}

/* ---------- CHALLENGE RENDERING ---------- */
let O = {}; // per-challenge temp state
function playChallenge(){
  const w=WORLDS[S.worldIdx], c=w.challenges[S.chIdx];
  O={};
  const head=`
    ${hud()}
    <div class="qcount">${w.icon} ${w.title} — ${c.boss?"⚔️ CAMP BOSS":"Challenge "+(S.chIdx+1)+" of "+w.challenges.length}</div>
    <div class="progressbar"><i style="width:${(S.chIdx/w.challenges.length)*100}%"></i></div>`;
  if(c.type==="mcq") renderMCQ(head,c);
  else if(c.type==="tf") renderTF(head,c);
  else if(c.type==="order") renderOrder(head,c);
  else if(c.type==="match") renderMatch(head,c);
}

function renderMCQ(head,c){
  O.map = shuffle(c.opts.map((t,i)=>({t,i})));
  render(`<div>${head}
    ${c.story?`<div class="qstory">${c.story}</div>`:""}
    <div class="qtext">${c.q}</div>
    ${O.map.map((o,k)=>`<button class="opt" id="o${k}" onclick="ansMCQ(${k})">${o.t}</button>`).join("")}
  </div>`);
}
function ansMCQ(k){
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  const good = O.map[k].i===c.correct;
  O.map.forEach((o,idx)=>{
    const el=document.getElementById("o"+idx);
    el.classList.add(o.i===c.correct?"correct":(idx===k?"wrong":"dim"));
    el.disabled=true;
  });
  setTimeout(()=>finishChallenge(good ? maxPts(c) : 0, good, c.explain), 650);
}

function renderTF(head,c){
  render(`<div>${head}
    <div class="qtext">${c.q}</div>
    <div class="qstory">“${c.statement}”</div>
    <div class="tfrow">
      <button class="opt" id="oT" onclick="ansTF(true)">TRUE</button>
      <button class="opt" id="oF" onclick="ansTF(false)">FALSE</button>
    </div>
  </div>`);
}
function ansTF(v){
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  const good = v===c.answer;
  document.getElementById(c.answer?"oT":"oF").classList.add("correct");
  if(!good) document.getElementById(v?"oT":"oF").classList.add("wrong");
  document.getElementById("oT").disabled=document.getElementById("oF").disabled=true;
  setTimeout(()=>finishChallenge(good?maxPts(c):0, good, c.explain), 650);
}

function renderOrder(head,c){
  O.pool = shuffle(c.items.slice());
  O.seq = [];
  render(`<div>${head}
    <div class="qtext">${c.q}</div>
    <div class="seq" id="seq"><div class="empty">Tap items below in the right order…</div></div>
    <div id="pool">${O.pool.map((t,k)=>`<button class="chip" id="p${k}" onclick="pick(${k})">${t}</button>`).join("")}</div>
    <button class="btn ghost" onclick="undoPick()">↩ Undo last</button>
    <button class="btn mt" id="subBtn" onclick="ansOrder()" style="display:none">Check my sequence</button>
  </div>`);
}
function pick(k){
  O.seq.push(O.pool[k]);
  document.getElementById("p"+k).classList.add("picked");
  drawSeq();
}
function undoPick(){
  if(!O.seq.length) return;
  const t=O.seq.pop();
  const k=O.pool.indexOf(t);
  document.getElementById("p"+k).classList.remove("picked");
  drawSeq();
}
function drawSeq(){
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  document.getElementById("seq").innerHTML = O.seq.length
    ? O.seq.map((t,i)=>`<div class="chip"><span>${t}</span><small>${i+1}</small></div>`).join("")
    : '<div class="empty">Tap items below in the right order…</div>';
  document.getElementById("subBtn").style.display = O.seq.length===c.items.length ? "block":"none";
}
function ansOrder(){
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  let hits=0; O.seq.forEach((t,i)=>{ if(t===c.items[i]) hits++; });
  const all = hits===c.items.length;
  const pts = all?150:(hits>=Math.ceil(c.items.length/2)?75:25);
  finishChallenge(pts, all, c.explain + (all?"":" Correct order: "+c.items.join(" → ")+"."));
}

function renderMatch(head,c){
  O.left = c.pairs.map(p=>p[0]);
  O.right = shuffle(c.pairs.map(p=>p[1]));
  O.selL=null; O.miss=0; O.locked=0;
  const rows = O.left.map((t,k)=>
    `<button class="mopt l" id="L${k}" onclick="selL(${k})"><b>${t}</b></button>`+
    `<button class="mopt" id="R${k}" onclick="selR(${k})">${O.right[k]}</button>`
  ).join("");
  render(`<div>${head}
    <div class="qtext">${c.q}</div>
    <p class="small" style="margin-bottom:12px">Tap an item in the left column, then its matching partner in the right column.</p>
    <div class="matchgrid">
      ${c.cols?`<div class="mhead">${c.cols[0]}</div><div class="mhead">${c.cols[1]}</div>`:""}
      ${rows}
    </div>
  </div>`);
}
function selL(k){
  if(O.selL!==null) document.getElementById("L"+O.selL).classList.remove("sel");
  O.selL=k; document.getElementById("L"+k).classList.add("sel");
}
function selR(k){
  if(O.selL===null) return;
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  const lTxt=O.left[O.selL], rTxt=O.right[k];
  const pair=c.pairs.find(p=>p[0]===lTxt);
  if(pair[1]===rTxt){
    document.getElementById("L"+O.selL).className="mopt lock";
    document.getElementById("R"+k).className="mopt lock";
    O.selL=null; O.locked++;
    if(O.locked===c.pairs.length){
      const pts = O.miss===0?150:(O.miss<=2?75:25);
      setTimeout(()=>finishChallenge(pts, O.miss===0, c.explain + (O.miss?` (You needed ${O.miss} extra ${O.miss===1?"try":"tries"}.)`:"")),450);
    }
  } else {
    O.miss++;
    const el=document.getElementById("R"+k);
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"),450);
  }
}

/* ---------- FEEDBACK & PROGRESSION ---------- */
function finishChallenge(pts, perfect, explain){
  const c=WORLDS[S.worldIdx].challenges[S.chIdx];
  let bonus=0;
  if(perfect){ S.streak++; if(S.streak>1) bonus=25; } else S.streak=0;
  S.worldScores[S.worldIdx]+=pts; S.score+=pts+bonus;
  const last = S.chIdx === WORLDS[S.worldIdx].challenges.length-1;
  render(`<div>
    ${hud()}
    <div class="fb ${perfect?"good":"bad"}">
      <div class="fbtitle">${perfect?(c.boss?"⚔️ Boss defeated!":"✓ Correct!"):(pts>0?"◐ Partly right":"✗ Not this time")}</div>
      <p><span class="pts">+${pts+bonus} pts</span>${bonus?" (includes 🔥 streak bonus)":""}</p>
      <p class="mt">${explain}</p>
    </div>
    <button class="btn" onclick="${last?"worldDone()":"nextChallenge()"}">${last?"Finish this world →":"Next challenge →"}</button>
  </div>`);
}
function nextChallenge(){ S.chIdx++; playChallenge(); }

function worldDone(){
  const i=S.worldIdx, w=WORLDS[i];
  const pct = S.worldScores[i]/S.worldMax[i];
  S.stars[i] = pct>=0.85?3:(pct>=0.6?2:1);

  confetti(50);
  render(`<div>
    ${hud()}
    <div class="card cine center">
      <div style="font-size:44px">${w.icon}</div>
      <h2 style="font-size:24px;font-weight:800">${w.title} — cleared!</h2>
      <div class="bigstars">${"★".repeat(S.stars[i])}${"☆".repeat(3-S.stars[i])}</div>
      <p class="small">${S.worldScores[i]} / ${S.worldMax[i]} world points</p>
      <div class="badge">${["","Trail Walker","Pathfinder","Summit Runner"][S.stars[i]]}</div>
    </div>
    <button class="btn" onclick="mapScreen()">Back to the map →</button>
  </div>`);
}

/* ---------- FINALE ---------- */
function enterFinale(){
  S.finaleStep=0; S.finaleCorrect=0;
  render(`<div>
    ${hud()}
    <div class="card cine">
      <div style="font-size:40px">${FINALE.icon}</div>
      <div class="eyebrow">Final boss — the Design Lab</div>
      <h2 style="font-size:26px;font-weight:800">${FINALE.title}</h2>

}
function finaleStep(){

  O.map = shuffle(st.opts.map((t,i)=>({t,i})));
  render(`<div>
    ${hud()}
    <div class="qcount">💡 THE LIGHTHOUSE — Decision ${S.finaleStep+1} of 5</div>

    ${O.map.map((o,k)=>`<button class="opt" id="o${k}" onclick="ansFinale(${k})">${o.t}</button>`).join("")}
  </div>`);
}
function ansFinale(k){
  const st=FINALE.steps[S.finaleStep];

  O.map.forEach((o,idx)=>{
    const el=document.getElementById("o"+idx);

  });
  let pts=0;
  if(good){ S.finaleCorrect++; S.streak++; pts=200+(S.streak>1?25:0); } else S.streak=0;

  setTimeout(()=>{
    render(`<div>
      ${hud()}
      <div class="fb ${good?"good":"bad"}">
        <div class="fbtitle">${good?"✓ Strong decision":"✗ The client hesitates…"}</div>
        <p><span class="pts">+${pts} pts</span></p>
        <p class="mt">${st.explain}</p>

      <button class="btn" onclick="${S.finaleStep<4?"S.finaleStep++;finaleStep()":"endScreen()"}">${S.finaleStep<4?"Next decision →":"Light the beacon →"}</button>
    </div>`);
  },650);
}

function resultsText(tier){

    for(let i=0;i<pos.count;i++){const t=Math.max(0,pos.getY(i)/300);const c=bot.clone().lerp(top,t);cols.push(c.r,c.g,c.b);}
    domeGeo.setAttribute("color",new THREE.Float32BufferAttribute(cols,3));

  /* photographic sky: 4K panorama, seam-blended, fog matched to its horizon */
  function loadSkyPanorama(url){

    img.onload=()=>{

        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        const cx=cv.getContext("2d");

  window.__islandMeshes=[];

      const bb=new THREE.Box3().setFromObject(isl), sz=bb.getSize(new THREE.Vector3());

        uniforms:{tDiffuse:{value:null},resolution:{value:new THREE.Vector2(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio())},sharpness:{value:MOBILE?.045:.11}},
        vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",

function themeCampSlabs(){
  /* Procedural camps (and failed CDN swaps) often ship bare white slabs.
     Recolor untextured near-white standard materials to the foundation stone.
     Skip MeshBasic lanterns/orbs and leave the lighthouse paint alone. */
  campGroups.forEach((g,i)=>{
    if(!g || i===4) return;
    g.traverse(o=>{
      if(!o.isMesh || !o.material) return;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{
        if(!m || !m.color || m.map) return;
        if(m.type==="MeshBasicMaterial") return;
        const lum=(m.color.r+m.color.g+m.color.b)/3;
        if(lum>0.72){
          m.color.setHex(PAD_COLOR);
          if("roughness" in m) m.roughness=.94;
          if("metalness" in m) m.metalness=0;
          m.needsUpdate=true;
        }
      });
    });
  });
}
function buildCamps(gtex){

    ()=>{ /* detective office: house + porch + lamppost */
      const g=new THREE.Group();
      const h=new THREE.Mesh(new THREE.BoxGeometry(3.8,2.8,3.4),lam(0x1E4A40));h.position.y=1.4;g.add(h);
      const r=new THREE.Mesh(new THREE.ConeGeometry(3.2,2,4),lam(0x0E2A22));r.position.y=3.9;r.rotation.y=Math.PI/4;g.add(r);
      const win=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xFFD98A}));

function mkSmoke(at){
  const N=10,geo=new THREE.BufferGeometry(),arr=new Float32Array(N*3),life=[];
  for(let i=0;i<N;i++){arr.set([at.x,at.y,at.z],i*3);life.push(Math.random());}
  geo.setAttribute("position",new THREE.BufferAttribute(arr,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x8FA79C,size:1.8,map:softTex,transparent:true,opacity:.32,depthWrite:false}));
  scene.add(pts);return {pts,at,life};
}
function mkSparks(at){
  const N=14,geo=new THREE.BufferGeometry(),arr=new Float32Array(N*3),vel=[],life=[];
  for(let i=0;i<N;i++){arr.set([at.x,at.y,at.z],i*3);vel.push(new THREE.Vector3(rnd(-.5,.5),rnd(1,2.4),rnd(-.5,.5)));life.push(Math.random());}

function nodeState(i){
  if(i===4)return S.worldIdx>=WORLDS.length?(S.phase==="end"?"done":"current"):"locked";
  return i<S.worldIdx?"done":(i===S.worldIdx?"current":"locked");
}
function animate3d(){
  requestAnimationFrame(animate3d);
  const t=performance.now()/1000, dt=1/60;
  /* camera */
  if(camAnim){
    camAnim.t+=camAnim.sp||.022;
    const k=camAnim.t>=1?1:(1-Math.pow(1-camAnim.t,3));
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,k);
    camera.lookAt(new THREE.Vector3().lerpVectors(camAnim.l0,camAnim.l1,k));
    if(camAnim.t>=1){const cb=camAnim.cb;camAnim=null;cb&&cb();}
  }else if(intro){
    orbit.theta+=.004;
    const dest=new THREE.Vector3(
      orbit.cx+orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta),
      orbit.cy+orbit.r*Math.cos(orbit.phi),
      orbit.cz+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta));
    camera.position.lerp(dest,0.02);
    camera.lookAt(orbit.cx,orbit.cy,orbit.cz);
    if(camera.position.distanceTo(dest)<2.5) intro=false;
  }else{
    orbit.theta+=.0008;
    camera.position.set(
      orbit.cx+orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta),
      orbit.cy+orbit.r*Math.cos(orbit.phi)+Math.sin(t*.8)*.4,
      orbit.cz+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta));
    camera.lookAt(orbit.cx+Math.sin(t*.31)*.9,orbit.cy+Math.cos(t*.23)*.6,orbit.cz);
  }
  /* water motion */
  if(water){
    if(water.material.uniforms&&water.material.uniforms.time){
      water.material.uniforms.time.value+=1/60;
    }else if(water.userData.base){
      const p=water.geometry.attributes.position,b=water.userData.base;
      for(let i=0;i<p.count;i++){
        const x=b[i*3],y=b[i*3+1];
        p.setZ(i,Math.sin(x*.08+t*1.1)*.5+Math.cos(y*.07+t*.9)*.5);
      }
      p.needsUpdate=true;
    }
  }
  clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>110)c.position.x=-110;});
  flames.forEach((f,fi)=>{const s=1+Math.sin(t*11+fi*1.7)*.22;if(f.isMesh)f.scale.set(s,1+Math.sin(t*13+fi)*.3,s);else f.intensity=1.3+Math.sin(t*9+fi)*.45;});
  smokes.forEach(s=>{
    const p=s.pts.geometry.attributes.position;
    for(let i=0;i<s.life.length;i++){
      s.life[i]+=dt*.35;if(s.life[i]>1)s.life[i]=0;
      const l=s.life[i];
      p.setXYZ(i,s.at.x+Math.sin(l*7+i)*.4*l,s.at.y+l*4.5,s.at.z+Math.cos(l*6+i)*.4*l);
    }p.needsUpdate=true;});
  if(sparks){
    const p=sparks.pts.geometry.attributes.position;
    for(let i=0;i<sparks.life.length;i++){
      sparks.life[i]+=dt*1.4;if(sparks.life[i]>1){sparks.life[i]=0;}
      const l=sparks.life[i],v=sparks.vel[i];
      p.setXYZ(i,sparks.at.x+v.x*l*2,sparks.at.y+v.y*l-2.5*l*l,sparks.at.z+v.z*l*2);
    }p.needsUpdate=true;}
  if(fireflies){
    const p=fireflies.pts.geometry.attributes.position;
    for(let i=0;i<fireflies.ph.length;i++){
      p.setY(i,p.getY(i)+Math.sin(t*1.3+fireflies.ph[i])*.012);
      p.setX(i,p.getX(i)+Math.cos(t*.7+fireflies.ph[i])*.008);
    }p.needsUpdate=true;
    fireflies.pts.material.opacity=.5+Math.sin(t*2)*.3;}
  prints.forEach(pr=>{
    if(pr.userData.spin)pr.rotation.y=t*.6;
    else pr.rotation.z=Math.sin(t*1.2+pr.userData.ph)*.03;});
  mist.forEach(m=>{const u=m.userData;m.position.set(Math.cos(t*u.sp+u.ph)*u.r,u.h+Math.sin(t*.3+u.ph)*.8,Math.sin(t*u.sp+u.ph)*u.r);m.material.opacity=.10+Math.sin(t*.5+u.ph)*.05;});
  birds.forEach(b=>{const u=b.userData;b.position.set(Math.cos(t*u.sp+u.ph)*u.r,u.h+Math.sin(t*1.1+u.ph)*1.2,Math.sin(t*u.sp+u.ph)*u.r);b.scale.y=1.5*(.7+.3*Math.abs(Math.sin(t*6+u.ph)));});
  if(foamRef)foamRef.children.forEach((f,i)=>{if(f.material.uniforms&&f.material.uniforms.uTime)f.material.uniforms.uTime.value=t;
    else f.material.opacity=f.userData.base*(.78+Math.sin(t*(.72+i*.09)+f.userData.phase)*.22);
    const s=1+Math.sin(t*.31+f.userData.phase)*.006;f.scale.set(s,s,s);});
  if(beaconPivot)beaconPivot.rotation.y=t*(S.phase==="end"?2.4:.55);
  /* orbs + halos */
  nodes3d.forEach(n=>{
    const st=nodeState(n.idx);
    n.orb.material.color.setHex(st==="done"?C.mint:(st==="current"?C.lime:C.locked));
    n.orb.scale.setScalar(st==="current"?1+Math.sin(t*4)*.28:1);
    n.halo.material.opacity=st==="current"?.5+Math.sin(t*4)*.25:(st==="done"?.25:0);
  });
  if(composer) composer.render(); else renderer.render(scene,camera);
  /* fps watchdog: auto-degrade effects on weak devices */
  if(!degraded){
    fpsN++; 
    if(!fpsT) fpsT=performance.now();
    const el=performance.now()-fpsT;
    if(el>5000){
      const fps=fpsN/(el/1000);
      if(fps<26){
        degraded=true;
        if(bloomPass) bloomPass.enabled=false;
        if(sunlightRef) sunlightRef.castShadow=false;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);
        console.warn("Low FPS ("+fps.toFixed(0)+") — effects reduced for smooth play");
      } else { fpsN=0; fpsT=performance.now(); degraded = fps>40; }
    }
  }
}
