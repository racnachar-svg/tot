function bindControls(cv){
  let down=false,moved=0,lx=0,ly=0,pinch=0;
  const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
  cv.addEventListener("pointerdown",e=>{down=true;moved=0;lx=e.clientX;ly=e.clientY;intro=false;});
  cv.addEventListener("pointermove",e=>{
    if(!down||camAnim)return;
    const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);
    orbit.theta+=dx*.006;orbit.phi=Math.min(1.45,Math.max(.45,orbit.phi-dy*.004));
    lx=e.clientX;ly=e.clientY;});
  cv.addEventListener("pointerup",e=>{
    down=false;
    if(moved<14&&S.phase==="map"&&!camAnim){
      v2.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
      ray.setFromCamera(v2,camera);
      const hit=ray.intersectObjects([...nodes3d.map(n=>n.hit),...nodes3d.map(n=>Object.assign(n.orb,{userData:{idx:n.idx}}))])[0];
      if(hit){const i=hit.object.userData.idx;
        if(nodeState(i)==="current")flyTo(i,()=>{
          if(i===4) playCinematic({video:VID.finale,title:FINALE.title,sub:"Final boss — everything combined"},()=>enterFinale());
          else { const w=WORLDS[i];
            playCinematic({video:VID[w.id]||null,title:w.title,sub:w.module},()=>afterCine(i)); }
        });}
    }});
  cv.addEventListener("wheel",e=>{orbit.r=Math.min(130,Math.max(34,orbit.r+e.deltaY*.05));},{passive:true});
  cv.addEventListener("touchmove",e=>{
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinch)orbit.r=Math.min(130,Math.max(34,orbit.r-(d-pinch)*.15));
      pinch=d;}},{passive:true});
  cv.addEventListener("touchend",()=>{pinch=0;});
}


/* ---- AI scatter mounting: one mesh, many instances ---- */
function normalizeGLB(m, targetH){
  const box=new THREE.Box3().setFromObject(m);
  const size=new THREE.Vector3(); box.getSize(size);
  const s=targetH/Math.max(size.y,0.001); m.scale.setScalar(s);
  const b2=new THREE.Box3().setFromObject(m);
  m.position.set(-(b2.min.x+b2.max.x)/2, -b2.min.y, -(b2.min.z+b2.max.z)/2);
  m.traverse(o=>{ if(o.isMesh){ o.visible=true;o.frustumCulled=false;o.castShadow=true;o.receiveShadow=true;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.filter(Boolean).forEach(mat=>{
      mat.side=THREE.DoubleSide;mat.envMapIntensity=.75;
      if(mat.map){mat.map.encoding=THREE.sRGBEncoding;mat.map.anisotropy=renderer.capabilities.getMaxAnisotropy();}
      if(mat.transparent||mat.alphaMap){mat.transparent=false;mat.alphaTest=.28;mat.depthWrite=true;}
      mat.needsUpdate=true;
    }); }});
  return m;
}
function mountScatterGLB(localName, cdnUrl, targets, baseH, replaceChildren){
  loadGLB(localName, cdnUrl, gltf=>{
    const proto=normalizeGLB(gltf.scene, baseH);
    targets.forEach(t=>{
      const inst=proto.clone();
      const sc=(t.scale&&t.scale.x)||1;
      inst.scale.multiplyScalar(sc*(0.85+Math.random()*0.3));
      inst.rotation.y=Math.random()*Math.PI*2;
      if(replaceChildren){ [...t.children].forEach(ch=>t.remove(ch)); t.add(inst); t.scale.setScalar(1); }
      else{ const p=t.position.clone(); const parent=t.parent; parent.remove(t);
            inst.position.copy(p); inst.position.y=Math.max(0,p.y-baseH*0.15); parent.add(inst); }
    });
  });
}
function mountNature(){
  /* Procedural pines/boulders are already settled on Froggy Island. Only upgrade
     when a local asset exists — the old CloudFront/Poly Haven CDNs 403/fail in
     browser and would otherwise just spam the console. */
  const tryLocal=(name,targets,h,replace)=>{
    if(!THREE.GLTFLoader) return;
    const L=new THREE.GLTFLoader();
    if(THREE.DRACOLoader){const D=new THREE.DRACOLoader();D.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/");L.setDRACOLoader(D);}
    L.load("assets/"+name, g=>{
      console.log("[asset] local nature OK:",name);
      const proto=normalizeGLB(g.scene, h);
      targets.forEach(t=>{
        const inst=proto.clone();
        const sc=(t.scale&&t.scale.x)||1;
        inst.scale.multiplyScalar(sc*(0.85+Math.random()*0.3));
        inst.rotation.y=Math.random()*Math.PI*2;
        if(replace){ [...t.children].forEach(ch=>t.remove(ch)); t.add(inst); t.scale.setScalar(1); }
        else{ const p=t.position.clone(); const parent=t.parent; parent.remove(t);
              inst.position.copy(p); inst.position.y=Math.max(0,p.y-h*0.15); parent.add(inst); }

/* ---- AI camp mesh mounting ---- */
function mountCampGLB(i, localName, url, targetH){
  if(!THREE.GLTFLoader || !campGroups[i]) return;
  try{
    loadGLB(localName, url, gltf=>{
      const m=gltf.scene;
      const box=new THREE.Box3().setFromObject(m);
      const size=new THREE.Vector3(); box.getSize(size);
      const s=targetH/Math.max(size.y,0.001); m.scale.setScalar(s);
      const b2=new THREE.Box3().setFromObject(m);
      m.position.set(-(b2.min.x+b2.max.x)/2, -b2.min.y, -(b2.min.z+b2.max.z)/2);
      m.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true;
        const finishMaterial=source=>{
          if(!source)return source;
          const mat=i===0?source.clone():source;mat.envMapIntensity=1.0;
          /* Keep the downloaded tent's fabric detail, but tint only that model
             warm brown so it remains visible against rock and greenery. */
          if(i===0 && mat.color){
            mat.color.setHex(mat.map?0xC18457:0x985E38);
            mat.roughness=.92;mat.metalness=0;
            if(mat.emissive){mat.emissive.setHex(0x1B0C04);mat.emissiveIntensity=.08;}
            mat.needsUpdate=true;
          }
          /* The generated cabin/tower/workshop meshes are only re-tinted for the
             tent above, so anything they ship with survives — including the bare
             white slab these models are often generated standing on. A material
             that is near-white AND carries no texture is that slab, never a
             designed surface, so it takes the foundation colour and reads as
             stone instead of polystyrene. Textured materials are left alone. */
          else if(mat.color && !mat.map){
            const lum=(mat.color.r+mat.color.g+mat.color.b)/3;
            if(lum>0.72){
              mat.color.setHex(PAD_COLOR);
              mat.roughness=.94;mat.metalness=0;mat.needsUpdate=true;
              console.log("[3D] camp",i,"— themed an untextured white slab in",localName);
            }
          }
          return mat;
        };
        o.material=Array.isArray(o.material)?o.material.map(finishMaterial):finishMaterial(o.material);
      }});
      const g=campGroups[i];
      /* remove structural meshes; keep lights, flames, glows and effect groups */
      [...g.children].forEach(ch=>{
        if(ch.isMesh && ch.material && ch.material.type!=="MeshBasicMaterial") g.remove(ch);
      });
      g.add(m);
      if(g.userData.bp) g.userData.bp.position.y = targetH + 1.3; /* blueprints ride the new tower */
      themeCampSlabs();
    });
  }catch(e){}
}

/* ---- cinematic cutscene layer ---- */
function playCinematic(opts, onEnd){
  let done=false,safetyTimer=null;
  const end=()=>{ if(done)return; done=true;
    if(safetyTimer)clearTimeout(safetyTimer);
    cine.classList.remove("on");
    setTimeout(()=>{ cine.style.display="none"; cine.innerHTML=""; onEnd&&onEnd(); }, 720);
  };
  const cine=document.getElementById("cine");
  cine.className = opts.video ? "" : "card-only";
  cine.innerHTML = `
    ${opts.video?`<video poster="assets/mountain-expedition-poster.jpg" autoplay ${opts.sound?"":"muted"} playsinline preload="auto"><source src="${opts.video}" type="video/mp4"></video>`:""}
    <div class="bar top"></div><div class="bar bot"></div>
    <div class="ctitle"><h2>${opts.title}</h2><p>${opts.sub||""}</p></div>
    <div class="skip">Tap to skip ▸</div>`;
  cine.style.display="block";
  requestAnimationFrame(()=>requestAnimationFrame(()=>cine.classList.add("on")));
  cine.onclick=null;
  const skip=cine.querySelector(".skip");
  if(skip)skip.onclick=e=>{e.stopPropagation();end();};
  const v=cine.querySelector("video");
  if(v){
    let smoothEnding=false;
    const beginSmoothEnding=()=>{
      if(smoothEnding)return;
      smoothEnding=true;
      cine.classList.add("ending");
    };
    /* Fade the picture and titles into black before the media reaches its last
       frame. This prevents the abrupt final-frame cut visible between worlds. */
    v.ontimeupdate=()=>{
      if(!Number.isFinite(v.duration)||v.duration<=0)return;
      const fadeWindow=Math.min(2,Math.max(1,v.duration*.12));
      if(v.duration-v.currentTime<=fadeWindow)beginSmoothEnding();
    };
    v.onended=()=>{beginSmoothEnding();setTimeout(end,320);};
    v.onerror=end;
    v.muted=!opts.sound;
    v.load();
    v.play().catch(()=>{
      /* Some browsers defer autoplay even after the Begin button. Keep the
         poster visible and retry on the next user interaction instead of
         silently ending the opening cinematic. */
      const retry=()=>{v.play().catch(()=>{});document.removeEventListener("pointerdown",retry);};
      document.addEventListener("pointerdown",retry,{once:true});
    });
    /* Never cut a valid cinematic at an arbitrary clock time. Use the real
       media duration, plus recovery room, and keep a long fallback only for a
       browser that stalls without firing ended/error. */
    const armSafety=()=>{
      if(safetyTimer)clearTimeout(safetyTimer);
      const duration=Number.isFinite(v.duration)&&v.duration>0?v.duration:292;
      safetyTimer=setTimeout(end,Math.min(600000,Math.max(30000,(duration+8)*1000)));
    };
    v.onloadedmetadata=armSafety;armSafety();
  } else {
    safetyTimer=setTimeout(end, 3400); // title card over the live island
  }
}

  window.__m1Fresh=function(){
    Object.assign(T,{step:0,observed:[],principles:[],vark:[],kolb:[],journal:'',trust:0});
    save(); route();
  };
})();
</script>
<script>
(() => {
 const KEY='the-last-educator-tna-v03';
 const M={step:0,evidence:[],methods:[],funnel:[],levels:[],causes:[],priorities:[],ethics:[],objective:[],reflection:''};
 try{Object.assign(M,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
 const save=()=>localStorage.setItem(KEY,JSON.stringify(M));
 const A=document.getElementById('app');
 const total=13,pct=()=>Math.round(M.step/total*100);
 const top=()=>`<div class="tle-top"><div class="tle-brand">FROM EXPERT TO EDUCATOR · THE DIAGNOSIS</div><div class="tle-progress"><i style="width:${pct()}%"></i></div><div>${pct()}%</div></div>`;
 const shell=b=>{document.body.classList.add('tle-mode');document.getElementById('veil').style.display='block';A.innerHTML=`<div class="tle-shell">${top()}${b}<div class="tle-footer">Module 2 progress saves automatically.</div></div>`;scrollTo(0,0);save()};
 const go=n=>{M.step=n;save();route()}; window.tnaGo=go;
 window.startTNA=()=>{M.step=0;save();route()};
 window.tnaReset=()=>{localStorage.removeItem(KEY);Object.assign(M,{step:0,evidence:[],methods:[],funnel:[],levels:[],causes:[],priorities:[],ethics:[],objective:[],reflection:''});route()};
 const toggle=(arr,v)=>{let i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);save();route()};
 window.tnaToggle=(type,v)=>toggle(M[type],v);
 function intro(){shell(`<section class="tle-panel"><div class="tle-kicker">Module 2 · Training Needs Assessment</div><h1 class="tle-title">The Diagnosis</h1><p class="tle-sub">A client has already decided what training they want. Your task is harder: discover what the organisation actually needs.</p><div class="tle-quote">“The best training starts with a question, not a slide.”</div><div class="tna-casebar"><span class="tna-chip"><b>Client:</b> NorthStar Contact Centre</span><span class="tna-chip"><b>Request:</b> Communication training</span><span class="tna-chip"><b>Problem:</b> Complaints rising</span></div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(1)">Accept the case</button><button class="tle-btn secondary" onclick="tnaReset()">Reset Module 2</button></div></section>`)}
 function request(){shell(`<section class="tle-panel"><div class="tle-kicker">09:10 · Executive briefing</div><h1 class="tle-title">“Book communication training.”</h1><p class="tle-sub">The Operations Manager is certain. Complaints are rising, so agents must need better communication skills.</p><div class="tle-mentor"><div class="face">🧓</div><div><div class="tle-kicker">Elias</div><div class="tle-quote" style="margin-top:4px">“A request is not evidence. What question comes before design?”</div></div></div><div class="tle-grid"><button class="tle-card" onclick="tnaFirst(false,this)"><h3>How many training days?</h3><p>Move quickly and scope delivery.</p></button><button class="tle-card" onclick="tnaFirst(true,this)"><h3>What should happen—and what is happening now?</h3><p>Clarify the performance gap before prescribing anything.</p></button><button class="tle-card" onclick="tnaFirst(false,this)"><h3>Which communication model?</h3><p>Select content before investigating.</p></button><button class="tle-card" onclick="tnaFirst(false,this)"><h3>Who is the best trainer?</h3><p>Focus on supplier choice.</p></button></div><div id="m2msg"></div></section>`)}
 window.tnaFirst=(ok,el)=>{document.querySelectorAll('.tle-card').forEach(x=>x.classList.remove('good','bad'));el.classList.add(ok?'good':'bad');document.getElementById('m2msg').innerHTML=ok?`<div class="tle-feedback"><b>TNA begins with a gap:</b> desired performance minus current performance. Then you test whether skill or knowledge is the cause.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(2)">See the cost of guessing</button></div>`:`<div class="tle-feedback bad"><b>That accepts the solution before proving the problem.</b> Diagnose first.</div>`};
 function cost(){const cards=[['Wrong content','A broad communication course misses product and policy gaps.'],['Wrong audience','The people who need help may be excluded by shifts or workload.'],['Wasted budget','Training time moves no business metric.'],['Lost credibility','Learners and sponsors stop trusting L&D.']];shell(`<section class="tle-panel"><div class="tle-kicker">Consequence simulation</div><h1 class="tle-title">Skip the assessment?</h1><p class="tle-sub">Open each consequence to see what happens when the imagined learner replaces the real one.</p><div class="tle-grid">${cards.map(([a,b],i)=>`<button class="tle-card ${M.causes.includes(a)?'bad':''}" onclick="tnaToggle('causes','${a}')"><h3>${M.causes.includes(a)?'⚠ ':''}${a}</h3><p>${M.causes.includes(a)?b:'Reveal consequence'}</p></button>`).join('')}</div>${M.causes.length===4?`<div class="tle-feedback warn"><b>Mentor Page unlocked:</b> TNA is the Analyse stage of ADDIE. It makes Design, Develop, Implement and Evaluate worth doing.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(3)">Map the need at three levels</button></div>`:''}</section>`)}
 function levels(){const L=[['Organisational','Where is the business going, and what capability must exist?'],['Task / occupational','What does excellent complaint handling require, step by step?'],['Individual','Which agents have the gap, and how large is it?']];shell(`<section class="tle-panel"><div class="tle-kicker">Diagnosis lens</div><h1 class="tle-title">Three heights. One gap.</h1><p class="tle-sub">Select all three levels. Missing one can make the diagnosis wrong.</p><div class="tle-grid three">${L.map(([a,b])=>`<button class="tle-card ${M.levels.includes(a)?'good':''}" onclick="tnaToggle('levels','${a}')"><h3>${M.levels.includes(a)?'✓ ':''}${a}</h3><p>${M.levels.includes(a)?b:'Examine this level'}</p></button>`).join('')}</div>${M.levels.length===3?`<div class="tle-note"><strong>Case insight:</strong> The strategy needs higher first-contact resolution; the task requires diagnosis, policy use and de-escalation; only 42 of 60 agents need coaching.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(4)">Choose who to consult</button></div>`:''}</section>`)}
 function stakeholders(){const S=[['Agents / learners','Felt needs, confidence and frontline reality'],['Team leaders & QA','Recurring errors and observed performance'],['Operations & CX','Targets, standards and strategic pressure'],['Customers & business data','Complaints, NPS and the definition of good']];shell(`<section class="tle-panel"><div class="tle-kicker">Stakeholder consultation</div><h1 class="tle-title">Every person holds one slice of truth.</h1><p class="tle-sub">A boardroom-only TNA misses the floor. Consult all four perspectives.</p><div class="tle-grid">${S.map(([a,b])=>`<button class="tle-card ${M.evidence.includes(a)?'good':''}" onclick="tnaToggle('evidence','${a}')"><h3>${M.evidence.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div>${M.evidence.length===4?`<div class="tle-feedback"><b>Trust condition:</b> consult frontline staff without line managers present, protect anonymity, schedule around peak workload, and pair opinions with hard data.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(5)">Build the evidence plan</button></div>`:''}</section>`)}
 function methods(){const X=[['Survey','Breadth and numbers across shifts'],['Interview','Depth and the “why” behind answers'],['Focus group','Shared patterns and disagreement'],['Observation','What people do, not only what they say'],['Document review','CRM, QA, complaints and existing trends']];shell(`<section class="tle-panel"><div class="tle-kicker">Evidence collection</div><h1 class="tle-title">No single method tells the whole story.</h1><p class="tle-sub">Choose at least three methods for a defensible diagnosis.</p><div class="tle-grid three">${X.map(([a,b])=>`<button class="tle-card ${M.methods.includes(a)?'good':''}" onclick="tnaToggle('methods','${a}')"><h3>${M.methods.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div>${M.methods.length>=3?`<div class="tle-feedback"><b>Mixed-method plan ready.</b> Breadth, depth and observed evidence can now confirm—or challenge—each other.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(6)">Design the survey</button></div>`:''}</section>`)}
 function survey(){shell(`<section class="tle-panel"><div class="tle-kicker">Method lab · Survey</div><h1 class="tle-title">Ask what you can use.</h1><p class="tle-sub">Which survey item gives measurable evidence while leaving room for the learner's own words?</p><div class="tle-grid"><button class="tle-card" onclick="tnaSurvey(false,this)"><h3>“Did you enjoy your job this month?”</h3><p>Interesting, but not tied to the suspected gap.</p></button><button class="tle-card" onclick="tnaSurvey(true,this)"><h3>“Rate confidence handling an angry customer (1–5). Where do you usually escalate?”</h3><p>Combines a countable rating with an open diagnostic prompt.</p></button><button class="tle-card" onclick="tnaSurvey(false,this)"><h3>“Would communication training help?”</h3><p>Leading question that assumes the solution.</p></button><button class="tle-card" onclick="tnaSurvey(false,this)"><h3>“Are managers supportive?”</h3><p>Potentially useful, but too broad for this instrument.</p></button></div><div id="surveymsg"></div></section>`)}
 window.tnaSurvey=(ok,el)=>{document.querySelectorAll('.tle-card').forEach(x=>x.classList.remove('good','bad'));el.classList.add(ok?'good':'bad');document.getElementById('surveymsg').innerHTML=ok?`<div class="tle-feedback"><b>Survey rule:</b> keep it short, anonymous and piloted. Mix closed items you can count with one or two open items that reveal context.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(7)">Conduct an interview</button></div>`:`<div class="tle-feedback bad"><b>Weak diagnostic value.</b> The question is broad, leading, or disconnected from performance.</div>`};
 function interview(){const stages=[['Open wide','Tell me about a normal shift.'],['Narrow','Where does it usually get difficult?'],['Probe','What have you tried? What happened?'],['Confirm','So the main barrier is… have I understood?']];const exp=stages[M.funnel.length]?.[0];shell(`<section class="tle-panel"><div class="tle-kicker">Method lab · Interview funnel</div><h1 class="tle-title">Listen more than you talk.</h1><p class="tle-sub">Build the interview sequence from broad experience to confirmed diagnosis.</p><div class="tle-grid">${stages.map(([a,b])=>`<button class="tle-card ${M.funnel.includes(a)?'good':''}" onclick="${a===exp?`tnaToggle('funnel','${a}')`:`tnaFunnelWrong()`}"><h3>${M.funnel.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div><div id="funnelmsg"></div>${M.funnel.length===4?`<div class="tle-feedback"><b>Interview completed:</b> the agent escalates because the refund policy is unclear and hard to find—not because they cannot communicate.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(8)">Triangulate the case</button></div>`:''}</section>`)}
 window.tnaFunnelWrong=()=>{document.getElementById('funnelmsg').innerHTML='<div class="tle-feedback warn"><b>Do not jump ahead.</b> Open wide, then narrow, probe and confirm.</div>'};
 function triangulate(){const data=[['Survey','Confidence handling angry customers: 2/5'],['Interviews','“I escalate because I do not know the refund policy.”'],['Monitoring','40% of complaint calls escalated unnecessarily']];shell(`<section class="tle-panel"><div class="tle-kicker">Analysis · Triangulation</div><h1 class="tle-title">Three sources. One pattern.</h1><p class="tle-sub">Reveal each evidence source. Confidence rises when independent methods converge.</p><div class="tna-evidence">${data.map(([a,b])=>`<button class="tna-doc ${M.objective.includes(a)?'selected':''}" onclick="tnaToggle('objective','${a}')"><h3>${a}</h3><p>${M.objective.includes(a)?b:'Open evidence'}</p></button>`).join('')}</div>${M.objective.length===3?`<div class="tle-feedback"><b>They converge:</b> agents lack de-escalation skill and quick access to policy. One cause is trainable; one requires a process/content fix.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(9)">Build the gap table</button></div>`:''}</section>`)}
 function gap(){shell(`<section class="tle-panel"><div class="tle-kicker">Gap analysis</div><h1 class="tle-title">Name the distance precisely.</h1><p class="tle-sub">Desired performance minus current performance reveals the gap. Then separate training from non-training causes.</p><table class="tna-table"><tr><th>Competency / condition</th><th>Desired</th><th>Current</th><th>Decision</th></tr><tr><td>De-escalation</td><td>All handle calmly</td><td>~70% struggle</td><td style="color:#5ce0b5">Train — skill</td></tr><tr><td>Refund policy</td><td>Rules known</td><td>Few know latest</td><td style="color:#5ce0b5">Train — knowledge</td></tr><tr><td>Knowledge base</td><td>Current & findable</td><td>Outdated</td><td style="color:#ffb86b">Fix process/content</td></tr><tr><td>Motivation</td><td>Engaged</td><td>Already strong</td><td>No gap</td></tr></table><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(10)">Make the recommendation</button></div></section>`)}
 function decision(){shell(`<section class="tle-panel"><div class="tle-kicker">Root-cause decision</div><h1 class="tle-title">The professional answer may be “no.”</h1><p class="tle-sub">What should you recommend to the sponsor?</p><div class="tle-grid"><button class="tle-card" onclick="tnaDecision(false,this)"><h3>Broad communication course</h3><p>Deliver exactly what was requested.</p></button><button class="tle-card" onclick="tnaDecision(true,this)"><h3>Focused training + system fix</h3><p>Scenario-based de-escalation and policy application for the 42 agents, plus repair the knowledge base.</p></button><button class="tle-card" onclick="tnaDecision(false,this)"><h3>Train all 60 agents</h3><p>Standardise participation regardless of demonstrated gap.</p></button><button class="tle-card" onclick="tnaDecision(false,this)"><h3>Motivation workshop</h3><p>Assume engagement is the issue despite evidence.</p></button></div><div id="decisionmsg"></div></section>`)}
 window.tnaDecision=(ok,el)=>{document.querySelectorAll('.tle-card').forEach(x=>x.classList.remove('good','bad'));el.classList.add(ok?'good':'bad');document.getElementById('decisionmsg').innerHTML=ok?`<div class="tle-feedback"><b>Defensible recommendation:</b> train only the people with skill or knowledge gaps, and route systems/process causes to the correct owner.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(11)">Prioritise and write SMART</button></div>`:`<div class="tle-feedback bad"><b>The evidence does not support that solution.</b> A good TNA protects the organisation from attractive but ineffective training.</div>`};
 function smart(){shell(`<section class="tle-panel"><div class="tle-kicker">Prioritisation & objective</div><h1 class="tle-title">Turn evidence into a decision.</h1><p class="tle-sub">The quick policy refresher is high impact / low effort. Full de-escalation certification is high impact / high effort. Which objective is SMART?</p><div class="tle-grid"><button class="tle-card" onclick="tnaSmart(false,this)"><h3>Agents will understand complaints.</h3><p>Vague and impossible to verify.</p></button><button class="tle-card" onclick="tnaSmart(true,this)"><h3>By end of Q3, 85% of Tier‑1 agents resolve a complaint on first contact, verified by call-quality scoring.</h3><p>Specific, measurable, achievable, relevant and time-bound.</p></button><button class="tle-card" onclick="tnaSmart(false,this)"><h3>Improve communication soon.</h3><p>No audience, degree, evidence or deadline.</p></button></div><div id="smartmsg"></div></section>`)}
 window.tnaSmart=(ok,el)=>{document.querySelectorAll('.tle-card').forEach(x=>x.classList.remove('good','bad'));el.classList.add(ok?'good':'bad');document.getElementById('smartmsg').innerHTML=ok?`<div class="tle-feedback"><b>Objective approved.</b> It links strategy → capability → gap → measurable result.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(12)">Issue the TNA report</button></div>`:`<div class="tle-feedback bad"><b>Not measurable enough.</b> State who will do what, to what standard, by when, and how it will be verified.</div>`};
 function report(){shell(`<section class="tle-panel"><div class="tle-kicker">Decision-ready output</div><h1 class="tle-title">Your diagnosis survives in the report.</h1><div class="tna-report"><h2>NorthStar Contact Centre — TNA Summary</h2><h3>Purpose & scope</h3><p>Investigate rising complaints across 60 Tier‑1 agents.</p><h3>Methods</h3><p>Anonymous survey, eight interviews, two days of call monitoring, QA and CRM review.</p><h3>Findings</h3><ul><li>70% struggle with de-escalation.</li><li>Refund-policy knowledge is inconsistent.</li><li>The knowledge base is outdated and difficult to search.</li><li>General communication and motivation are not the primary gaps.</li></ul><h3>Recommendation</h3><p>Scenario-based Complaint Resolution & De-escalation for the 42 affected agents; targeted policy refresher; parallel knowledge-base repair.</p><h3>Out of scope</h3><p>System and content-management fixes are assigned to Operations and Knowledge Management.</p><span class="stamp">EVIDENCE-LED</span></div><div class="tle-note"><strong>Ethics built in:</strong> informed consent, confidentiality, fair coverage of every shift, and findings returned to participants.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaGo(13)">Complete the diagnosis</button></div></section>`)}
 function end(){shell(`<section class="tle-panel"><div class="tle-mentor"><div class="face">🧓</div><div><div class="tle-kicker">Elias</div><h1 class="tle-title" style="font-size:40px">“You listened before designing.”</h1><p class="tle-sub">The sponsor asked for a course. You returned with evidence, a focused training solution, and the courage to name what training cannot fix.</p></div></div><div class="tle-grid three"><div class="tle-card good"><h3>Diagnose</h3><p>Organisational, task and individual levels.</p></div><div class="tle-card good"><h3>Triangulate</h3><p>Combine voices, behaviour and records.</p></div><div class="tle-card good"><h3>Decide</h3><p>Train skill and knowledge; route everything else correctly.</p></div></div><div class="tle-quote">The best training starts with a question, not a slide.</div><div class="tle-actions"><button class="tle-btn" onclick="tnaReset()">Replay Module 2</button><button class="tle-btn secondary" onclick="location.reload()">Return to Module 1</button></div><div class="tle-actions"><button class="tle-btn" onclick="__courseDone(1)">⚔ Take the Detective Challenge</button></div></section>`)}
 function route(){[intro,request,cost,levels,stakeholders,methods,survey,interview,triangulate,gap,decision,smart,report,end][M.step]();}
})();
</script>
<script>
(()=>{
 const KEY='tle_module3_v04';
 const A=document.getElementById('app')||document.querySelector('.app');
 let S=Object.assign({step:0,ksa:[],backward:[],chain:[],abcd:{},smart:[],hierarchy:[],sequence:[],flow:[],score:0},JSON.parse(localStorage.getItem(KEY)||'{}'));
 const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
 const top=()=>`<div class="tle-top"><div><div class="tle-kicker">From Expert to Educator · Module 3</div><b>Curriculum Architect</b></div><div class="tle-progress"><span style="width:${Math.round((S.step/12)*100)}%"></span></div></div>`;
 const shell=b=>{document.body.classList.add('tle-mode');document.getElementById('veil').style.display='block';A.innerHTML=`<div class="tle-shell">${top()}${b}<div class="tle-footer">Module 3 progress saves automatically.</div></div>`;scrollTo(0,0);save()};
 window.m3Go=n=>{S.step=n;save();route()};
 window.m3Reset=()=>{localStorage.removeItem(KEY);S={step:0,ksa:[],backward:[],chain:[],abcd:{},smart:[],hierarchy:[],sequence:[],flow:[],score:0};route()};
 window.startModule3=()=>route();
 function choice(id,ok,next,good,bad){document.querySelectorAll('[data-choice="'+id+'"]').forEach(x=>x.classList.remove('good','bad'));const el=event.currentTarget;el.classList.add(ok?'good':'bad');document.getElementById(id+'msg').innerHTML=ok?`<div class="tle-feedback"><b>${good}</b></div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(${next})">Continue</button></div>`:`<div class="tle-feedback bad"><b>${bad}</b></div>`}
 window.m3Choice=choice;
 function intro(){shell(`<section class="tle-panel"><div class="tle-kicker">Session 3 · Curriculum & Session Design</div><h1 class="tle-title">The Architect</h1><p class="tle-sub">A needs assessment has identified the gap. Now you must turn evidence into a training design that can actually produce competence.</p><div class="tle-quote">“Do not begin with content. Begin with what learners must be able to do.”</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(1)">Enter the design studio</button><button class="tle-btn secondary" onclick="m3Reset()">Reset Module 3</button></div></section>`)}
 function broken(){shell(`<section class="tle-panel"><div class="tle-kicker">Case file · The failed course</div><h1 class="tle-title">A beautiful training that changed nothing.</h1><p class="tle-sub">Eighty staff attended a polished workshop. Three days later, performance was unchanged. Which design mistake should you investigate first?</p><div class="tle-grid"><button data-choice="broken" class="tle-card" onclick="m3Choice('broken',false,2,'','Start before the slides: what result was the program meant to produce?')"><h3>The colour palette</h3><p>Visual quality matters, but it cannot replace a performance result.</p></button><button data-choice="broken" class="tle-card" onclick="m3Choice('broken',true,2,'Correct. The course had topics, but no defined performance outcome, evidence, or aligned path.','')"><h3>The missing outcome</h3><p>No one defined what learners should be able to do afterwards.</p></button><button data-choice="broken" class="tle-card" onclick="m3Choice('broken',false,2,'','More content is not the answer when the destination is unclear.')"><h3>Not enough content</h3><p>Add more slides and explanations.</p></button></div><div id="brokenmsg"></div></section>`)}
 function design(){shell(`<section class="tle-panel"><div class="tle-kicker">Design rule</div><h1 class="tle-title">Result. Path. Proof.</h1><p class="tle-sub">Training design sits between a need and delivery. It makes three decisions before materials are built.</p><div class="tle-grid three"><div class="tle-card good"><h3>1 · Decide the result</h3><p>What should learners be able to do?</p></div><div class="tle-card good"><h3>2 · Choose the path</h3><p>What content, sequence and activities will get them there?</p></div><div class="tle-card good"><h3>3 · Plan the proof</h3><p>How will they show they can do it?</p></div></div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(3)">Build the competency</button></div></section>`)}
 function ksa(){const items=[['Knowledge','Explain the three steps of complaint handling'],['Skill','Demonstrate de-escalation in a role-play'],['Attitude','Stay respectful and calm under pressure']];shell(`<section class="tle-panel"><div class="tle-kicker">Competency forge</div><h1 class="tle-title">Knowledge + Skill + Attitude</h1><p class="tle-sub">Select all three ingredients. A competency is not merely a topic; it is something a learner can perform well in context.</p><div class="tle-grid three">${items.map(([a,b])=>`<button class="tle-card ${S.ksa.includes(a)?'good':''}" onclick="m3Toggle('ksa','${a}')"><h3>${S.ksa.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div>${S.ksa.length===3?`<div class="tle-feedback"><b>Competency forged:</b> learners know the process, can perform it, and apply it with the right professional attitude.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(4)">Design backwards</button></div>`:''}</section>`)}
 window.m3Toggle=(key,val)=>{if(!S[key].includes(val))S[key].push(val);save();route()};
 function backwards(){const order=[['Define the outcome','What should learners be able to do?'],['Decide the evidence','How will they show they can do it?'],['Plan the learning','What content and activities will prepare them?']];const exp=order[S.backward.length]?.[0];shell(`<section class="tle-panel"><div class="tle-kicker">Backward design</div><h1 class="tle-title">Build from the end.</h1><p class="tle-sub">Choose the three steps in the correct design order.</p><div class="tle-grid three">${order.map(([a,b])=>`<button class="tle-card ${S.backward.includes(a)?'good':''}" onclick="${a===exp?`m3Toggle('backward','${a}')`:`m3Wrong('backmsg','Start with the outcome, then evidence, then learning.')`}"><h3>${S.backward.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div><div id="backmsg"></div>${S.backward.length===3?`<div class="tle-feedback"><b>Design reversed successfully.</b> Content is now chosen because it serves evidence of the intended outcome.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(5)">Repair the alignment chain</button></div>`:''}</section>`)}
 window.m3Wrong=(id,msg)=>document.getElementById(id).innerHTML=`<div class="tle-feedback warn"><b>${msg}</b></div>`;
 function chain(){const links=['Need','Competency','Objective','Method','Assessment'];const exp=links[S.chain.length];shell(`<section class="tle-panel"><div class="tle-kicker">Alignment challenge</div><h1 class="tle-title">Every link must hold.</h1><p class="tle-sub">Construct the line from the gap to proof of learning.</p><div class="m3-chain">${links.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<button class="link ${S.chain.includes(x)?'good':''}" onclick="${x===exp?`m3Toggle('chain','${x}')`:`m3Wrong('chainmsg','Follow the dependency: need → competency → objective → method → assessment.')`}"><b>${S.chain.includes(x)?'✓ ':''}${x}</b><small style="display:block;color:var(--muted);margin-top:6px">${['Gap to close','What they can do','Learning target','How you teach','How you check'][i]}</small></button>`).join('')}</div><div id="chainmsg"></div>${S.chain.length===5?`<div class="tle-feedback"><b>Alignment restored.</b> A break anywhere would weaken every decision that follows.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(6)">Separate goals from objectives</button></div>`:''}</section>`)}
 function goal(){shell(`<section class="tle-panel"><div class="tle-kicker">Goal or objective?</div><h1 class="tle-title">Broad direction is not yet a learning target.</h1><p class="tle-sub">Which statement is an objective?</p><div class="tle-grid"><button data-choice="goal" class="tle-card" onclick="m3Choice('goal',false,7,'','This is a broad program direction, not an observable result.')"><h3>Improve customer service culture.</h3><p>Aspiration for the whole program.</p></button><button data-choice="goal" class="tle-card" onclick="m3Choice('goal',true,7,'Correct. It describes a specific, observable learner performance.','')"><h3>By the end of the session, agents will demonstrate the five-step complaint process in a simulated call.</h3><p>Specific learner result.</p></button></div><div id="goalmsg"></div></section>`)}
 function abcd(){const opts={A:['Tier-1 agents','Managers'],B:['demonstrate','understand'],C:['using the complaint checklist','someday'],D:['with all five steps in order','well']};shell(`<section class="tle-panel"><div class="tle-kicker">ABCD objective forge</div><h1 class="tle-title">Build an objective you can see.</h1><p class="tle-sub">Choose Audience, Behaviour, Condition and Degree.</p><div class="m3-builder">${Object.entries(opts).map(([k,arr])=>`<div class="m3-row"><div class="m3-label">${k} · ${{A:'Audience',B:'Behaviour',C:'Condition',D:'Degree'}[k]}</div><div>${arr.map(v=>`<button class="tle-card ${S.abcd[k]===v?'good':''}" style="display:inline-block;width:auto;margin:4px" onclick="m3ABCD('${k}','${v}')">${v}</button>`).join('')}</div></div>`).join('')}</div>${Object.keys(S.abcd).length===4?`<div class="m3-objective"><b>Objective:</b> ${S.abcd.A} will ${S.abcd.B} the complaint process ${S.abcd.C}, ${S.abcd.D}.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(8)">Run the quality test</button></div>`:''}</section>`)}
 window.m3ABCD=(k,v)=>{S.abcd[k]=v;save();route()};
 function smart(){const checks=[['Specific','One clear action and audience'],['Measurable','Observable performance'],['Achievable','Realistic in the session'],['Relevant','Linked to the diagnosed gap'],['Time-bound','By the end of the session']];shell(`<section class="tle-panel"><div class="tle-kicker">SMART scanner</div><h1 class="tle-title">Quality-test the objective.</h1><p class="tle-sub">Activate all five checks.</p><div class="tle-grid three">${checks.map(([a,b])=>`<button class="tle-card ${S.smart.includes(a)?'good':''}" onclick="m3Toggle('smart','${a}')"><h3>${S.smart.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div>${S.smart.length===5?`<div class="tle-feedback"><b>Objective approved.</b> Replace vague verbs such as “know” or “understand” with actions learners can demonstrate.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(9)">Structure the program</button></div>`:''}</section>`)}
 function hierarchy(){const items=['Program','Module','Session','Activity'];const exp=items[S.hierarchy.length];shell(`<section class="tle-panel"><div class="tle-kicker">From big to small</div><h1 class="tle-title">Nest the learning.</h1><p class="tle-sub">Build the hierarchy from the whole course down to one task.</p><div class="tle-grid">${items.map(x=>`<button class="tle-card ${S.hierarchy.includes(x)?'good':''}" onclick="${x===exp?`m3Toggle('hierarchy','${x}')`:`m3Wrong('hiermsg','Start with Program, then Module, Session and Activity.')`}"><h3>${S.hierarchy.includes(x)?'✓ ':''}${x}</h3><p>${{Program:'The whole course',Module:'A theme within it',Session:'One sitting',Activity:'One task'}[x]}</p></button>`).join('')}</div><div id="hiermsg"></div>${S.hierarchy.length===4?`<div class="tle-actions"><button class="tle-btn" onclick="m3Go(10)">Choose a sequence</button></div>`:''}</section>`)}
 function sequence(){const scenarios=[['Simple → complex','Learners are new to data analysis; begin with reading one chart before combining datasets.'],['Known → unknown','Start from familiar customer complaints, then introduce a new de-escalation framework.'],['Step by step','Teach the required procedure in dependency order.'],['Real-world order','Follow the exact order a complaint call unfolds.']];shell(`<section class="tle-panel"><div class="tle-kicker">Sequencing logic</div><h1 class="tle-title">Order changes learning.</h1><p class="tle-sub">Explore all four useful ways to sequence content.</p><div class="tle-grid">${scenarios.map(([a,b])=>`<button class="tle-card ${S.sequence.includes(a)?'good':''}" onclick="m3Toggle('sequence','${a}')"><h3>${S.sequence.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div>${S.sequence.length===4?`<div class="tle-feedback"><b>Sequence toolbox unlocked.</b> Strong programs often combine more than one logic.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(11)">Build the session flow</button></div>`:''}</section>`)}
 function flow(){const stages=['Hook','Teach','Practise','Close'];const exp=stages[S.flow.length];shell(`<section class="tle-panel"><div class="tle-kicker">Session architecture</div><h1 class="tle-title">Hook → Teach → Practise → Close</h1><p class="tle-sub">Build the reliable session flow in order. Practice should receive more time than trainer talk.</p><div class="m3-timeline">${stages.map((x,i)=>`<button class="m3-stage ${S.flow.includes(x)?'good':''}" onclick="${x===exp?`m3Toggle('flow','${x}')`:`m3Wrong('flowmsg','Open interest, explain briefly, let them practise, then recap and check.')`}"><strong>${S.flow.includes(x)?'✓ ':''}${x}</strong>${['Open with a real problem','Explain in small pieces','Learners do the work','Recap and verify'][i]}</button>`).join('')}</div><div id="flowmsg"></div>${S.flow.length===4?`<div class="tle-feedback"><b>Memory design:</b> keep chunks small, require recall, revisit ideas later and vary the methods.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Go(12)">Face the final client brief</button></div>`:''}</section>`)}
 function finalcase(){shell(`<section class="tle-panel"><div class="tle-kicker">Final design commission</div><h1 class="tle-title">Build one aligned session.</h1><p class="tle-sub">Client need: supervisors avoid giving corrective feedback. Choose the strongest design.</p><div class="tle-grid"><button data-choice="final" class="tle-card" onclick="m3Choice('final',false,13,'','This starts with content and lacks observable performance evidence.')"><h3>Presentation-first design</h3><p>Goal: understand feedback. Method: 45-minute lecture. Assessment: satisfaction survey.</p></button><button data-choice="final" class="tle-card" onclick="m3Choice('final',true,13,'Commission approved. The need, competency, objective, method and assessment are aligned.','')"><h3>Performance-first design</h3><p>Outcome: conduct a corrective-feedback conversation. Evidence: role-play checklist. Learning: model, guided practice, repeated role-play and feedback.</p></button><button data-choice="final" class="tle-card" onclick="m3Choice('final',false,13,'','An attractive activity without alignment is still weak design.')"><h3>Activity-first design</h3><p>Begin with games, then decide later what they were meant to teach.</p></button></div><div id="finalmsg"></div></section>`)}
 function end(){shell(`<section class="tle-panel"><div class="tle-mentor"><div class="face">🧓</div><div><div class="tle-kicker">Elias</div><h1 class="tle-title" style="font-size:40px">“You stopped arranging content. You started engineering competence.”</h1><p class="tle-sub">A diagnosis became an outcome. The outcome became evidence. The evidence shaped the learning.</p></div></div><div class="tle-grid three"><div class="tle-card good"><h3>Design backwards</h3><p>Outcome before content.</p></div><div class="tle-card good"><h3>Write observable objectives</h3><p>ABCD + SMART + visible verbs.</p></div><div class="tle-card good"><h3>Align the whole chain</h3><p>Need through assessment.</p></div></div><div class="tle-quote">If you cannot picture the learner doing it, it is still a topic—not a competency.</div><div class="tle-actions"><button class="tle-btn" onclick="m3Reset()">Replay Module 3</button></div><div class="m3-actions tle-actions"><button class="m3-btn tle-btn" onclick="__courseDone(2)">⚔ Take the Architect Challenge</button></div></section>`)}
 function route(){[intro,broken,design,ksa,backwards,chain,goal,abcd,smart,hierarchy,sequence,flow,finalcase,end][S.step]();}
 /* Module 3 autostart disabled in the Module 4 build. */
})();
</script>
<script>
(()=>{
 const A=document.getElementById('app');
 const KEY='tle_module4_material_workshop_v1';
 const fresh=()=>({step:0,principles:[],clearFixes:[],access:[],licenses:[],resources:[],tools:[],scenario:null,checks:[],trust:0});
 let S={...fresh(),...(JSON.parse(localStorage.getItem(KEY)||'{}'))};
 const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
 const top=()=>`<div class="m4-top"><div><div class="m4-kicker">From Expert to Educator · Module 4</div><b>Material Workshop</b></div><div class="m4-progress"><span style="width:${Math.round((S.step/10)*100)}%"></span></div></div>`;
 const shell=b=>{document.body.classList.add('m4-mode');document.getElementById('veil').style.display='block';A.innerHTML=`<div class="m4-shell">${top()}${b}<div class="m4-footer">Module 4 progress saves automatically.</div></div>`;scrollTo(0,0);save()};
 window.m4Go=n=>{S.step=n;save();route()};
 window.m4Reset=()=>{localStorage.removeItem(KEY);S=fresh();route()};
 window.m4Toggle=(arr,val)=>{if(!S[arr].includes(val))S[arr].push(val);save();route()};
 window.m4Wrong=(id,msg)=>document.getElementById(id).innerHTML=`<div class="m4-feedback bad"><b>${msg}</b></div>`;
 window.m4Choose=(key,val,next,good,bad)=>{S[key]=val;save();document.querySelectorAll('[data-m4="'+key+'"]').forEach(x=>x.classList.remove('good','bad'));event.currentTarget.classList.add(val==='right'?'good':'bad');document.getElementById(key+'msg').innerHTML=`<div class="m4-feedback ${val==='right'?'':'bad'}"><b>${val==='right'?good:bad}</b></div>${val==='right'?`<div class="m4-actions"><button class="m4-btn" onclick="m4Go(${next})">Continue</button></div>`:''}`};

 function intro(){shell(`<section class="m4-panel"><div class="m4-kicker">Session 4 · Training Materials & Tools</div><h1 class="m4-title">The Material<br>Workshop</h1><p class="m4-sub">Your training design is ready. Now the Academy must create materials that make the message easier—not harder—to understand.</p><div class="m4-quote">“Keep it simple. Make it work.”</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(1)">Open the workshop</button><button class="m4-btn secondary" onclick="m4Reset()">Reset Module 4</button></div></section>`)}

 function broken(){shell(`<section class="m4-panel"><div class="m4-kicker">The first commission</div><h1 class="m4-title">A beautiful slide<br>that no one can read.</h1><p class="m4-sub">A trainer submits this handout. It contains everything—but learners spend all their energy decoding it.</p><div class="m4-workbench"><div class="m4-before"><h3>Complete Guide to Effective Communication in Modern Organizations</h3><p class="tiny">Communication is a multifaceted process involving senders, receivers, channels, feedback mechanisms, semantic interpretation, cultural context, psychological safety, nonverbal behaviour, organizational hierarchy, noise, conflict, personal bias, active listening, emotional intelligence, feedback loops, meeting design, team dynamics, asynchronous tools, documentation, escalation processes and stakeholder expectations. The ability to communicate effectively therefore requires detailed understanding of multiple conceptual frameworks and procedural approaches that must be remembered and deployed simultaneously across a variety of contexts...</p></div></div><div class="m4-feedback warn"><b>Your task:</b> rescue the learning by removing what competes with the main message.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(2)">Enter simplification mode</button></div></section>`)}

 function principles(){const p=[['Clear','Easy to read and follow'],['Accessible','Works for every learner'],['Respectful','Uses and credits sources properly']];shell(`<section class="m4-panel"><div class="m4-kicker">Three core principles</div><h1 class="m4-title">Every material must pass three doors.</h1><p class="m4-sub">Unlock each principle to reveal what professional material design protects.</p><div class="m4-grid three">${p.map(([a,b])=>`<button class="m4-card ${S.principles.includes(a)?'good':''}" onclick="m4Toggle('principles','${a}')"><div class="m4-icon">${a==='Clear'?'◫':a==='Accessible'?'◎':'©'}</div><h3>${S.principles.includes(a)?'✓ ':''}${a}</h3><p>${S.principles.includes(a)?b:'Open this principle.'}</p></button>`).join('')}</div>${S.principles.length===3?`<div class="m4-feedback"><b>Design standard unlocked:</b> clear, accessible and respectful.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(3)">Repair the cluttered page</button></div>`:''}</section>`)}

 function clarity(){const fixes=[['One idea','Keep one message on the page'],['Few words','Replace paragraphs with concise points'],['Readable size','Use type that works at a glance'],['White space','Give the message room to breathe']];shell(`<section class="m4-panel"><div class="m4-kicker">Clarity lab</div><h1 class="m4-title">Remove before you add.</h1><p class="m4-sub">Activate every repair. The material will simplify as you work.</p><div class="m4-toggles">${fixes.map(([a,b])=>`<button class="m4-chip ${S.clearFixes.includes(a)?'on':''}" onclick="m4Toggle('clearFixes','${a}')">${S.clearFixes.includes(a)?'✓ ':''}${a}</button>`).join('')}</div><div class="m4-workbench"><div class="${S.clearFixes.length===4?'m4-after':'m4-before'}">${S.clearFixes.length===4?`<h3>Handle an upset customer</h3><ul><li>Listen without interrupting</li><li>Confirm the real issue</li><li>Explain the next action</li></ul>`:`<h3>Complete Guide to Effective Communication in Modern Organizations</h3><p class="tiny">Communication is a multifaceted process involving senders, receivers, channels, feedback mechanisms, semantic interpretation, cultural context, psychological safety, nonverbal behaviour, organizational hierarchy, noise, conflict, personal bias, active listening, emotional intelligence, feedback loops, meeting design, team dynamics, asynchronous tools, documentation and escalation processes...</p>`}</div></div>${S.clearFixes.length===4?`<div class="m4-feedback"><b>Clarity restored.</b> The message can now be understood in seconds.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(4)">Test accessibility</button></div>`:''}</section>`)}

 function access(){const items=[['Large text','Readable without zooming'],['Strong contrast','Text separates clearly from the background'],['Plain language','Words do not create unnecessary barriers'],['Multiple formats','Works on paper and phone']];shell(`<section class="m4-panel"><div class="m4-kicker">Accessibility lab</div><h1 class="m4-title">Make it work for everyone.</h1><p class="m4-sub">Select all four design choices that remove barriers.</p><div class="m4-grid">${items.map(([a,b])=>`<button class="m4-card ${S.access.includes(a)?'good':''}" onclick="m4Toggle('access','${a}')"><h3>${S.access.includes(a)?'✓ ':''}${a}</h3><p>${b}</p></button>`).join('')}</div><div class="m4-a11y-demo"><div class="m4-demo badview"><h3>Before</h3><p>Complex terminology and insufficient visual contrast create unnecessary cognitive and perceptual barriers for diverse end users.</p></div><div class="m4-demo goodview"><h3>After</h3><p>Use clear words, readable text and strong contrast so every learner can use the material.</p></div></div>${S.access.length===4?`<div class="m4-feedback"><b>Accessibility passed.</b> Designing for people with different devices, literacy levels and environments improves the material for everyone.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(5)">Enter the rights archive</button></div>`:''}</section>`)}

 function rights(){shell(`<section class="m4-panel"><div class="m4-kicker">Rights archive</div><h1 class="m4-title">“Found online” is not a licence.</h1><p class="m4-sub">Which action is professionally and ethically sound?</p><div class="m4-license"><button data-m4="license" class="m4-card" onclick="m4Choose('license','wrong',6,'','Being downloadable does not make an asset free to reuse.')"><h3>Copy any image</h3><p>It appears in a search result, so it must be free.</p></button><button data-m4="license" class="m4-card" onclick="m4Choose('license','right',6,'Correct. Check the licence, follow its terms and credit the creator.','')"><h3>Verify and credit</h3><p>Use a clearly licensed or public-domain resource and record the attribution.</p></button><button data-m4="license" class="m4-card" onclick="m4Choose('license','wrong',6,'','Removing a watermark does not remove the creator’s rights.')"><h3>Remove the watermark</h3><p>Then the image looks original.</p></button></div><div id="licensemsg"></div></section>`)}

 function resources(){const r=[['Images','Use a source with clear reuse terms'],['Icons','Check whether attribution is required'],['Fonts','Prefer open-source font libraries'],['Music','Confirm the licence covers your intended use']];shell(`<section class="m4-panel"><div class="m4-kicker">Resource shelf</div><h1 class="m4-title">Free to download ≠ free to use.</h1><p class="m4-sub">Open every shelf and collect the licence habit that belongs with it.</p><div class="m4-grid four">${r.map(([a,b])=>`<button class="m4-card ${S.resources.includes(a)?'good':''}" onclick="m4Toggle('resources','${a}')"><div class="m4-icon">${a==='Images'?'▧':a==='Icons'?'◉':a==='Fonts'?'Aa':'♫'}</div><h3>${S.resources.includes(a)?'✓ ':''}${a}</h3><p>${S.resources.includes(a)?b:'Inspect this shelf.'}</p></button>`).join('')}</div>${S.resources.length===4?`<div class="m4-feedback"><b>Professional habit:</b> preserve the source, author and licence while you build—not after the material is finished.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(7)">Choose the right tool</button></div>`:''}</section>`)}

 function tools(){const t=[['Job aid','Quick on-the-job reference','🧭'],['Handout','Something learners keep and revisit','📄'],['Visual','A slide, poster or chart for presentation','▣'],['Digital','A quiz, shared document or interactive app','⌁']];shell(`<section class="m4-panel"><div class="m4-kicker">Tool gallery</div><h1 class="m4-title">Different tools do different jobs.</h1><p class="m4-sub">Inspect all four tools. Complexity is not a quality measure.</p><div class="m4-toolrow">${t.map(([a,b,i])=>`<button class="m4-tool ${S.tools.includes(a)?'good':''}" onclick="m4Toggle('tools','${a}')"><span style="font-size:30px">${i}</span><strong>${S.tools.includes(a)?'✓ ':''}${a}</strong><small>${b}</small></button>`).join('')}</div>${S.tools.length===4?`<div class="m4-feedback"><b>Selection rule:</b> choose according to who will use it, where they will use it, and what they need it to do.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(8)">Solve a real setting</button></div>`:''}</section>`)}

 function simplest(){shell(`<section class="m4-panel"><div class="m4-kicker">The simplest tool that works</div><h1 class="m4-title">No signal. Gloves on. Thirty seconds.</h1><p class="m4-sub">Field technicians need to check a five-step safety procedure beside a noisy generator. Internet access is unreliable. Which material should you create?</p><div class="m4-grid three"><button data-m4="scenario" class="m4-card" onclick="m4Choose('scenario','wrong',9,'','A video depends on connection, sound and attention the setting cannot guarantee.')"><h3>Streaming video</h3><p>A polished four-minute explanation.</p></button><button data-m4="scenario" class="m4-card" onclick="m4Choose('scenario','right',9,'Correct. A durable one-page visual job aid can be scanned quickly at the point of work.','')"><h3>One-page job aid</h3><p>Large steps, clear icons and a compact safety check.</p></button><button data-m4="scenario" class="m4-card" onclick="m4Choose('scenario','wrong',9,'','A 40-slide deck is too slow and difficult to use at the moment of need.')"><h3>Slide deck</h3><p>Forty detailed slides for complete coverage.</p></button></div><div id="scenariomsg"></div></section>`)}

 function finalstudio(){const checks=[['Clear','One idea, few words, readable'],['Usable','Fits the learner and setting'],['Credited','Sources and licences recorded']];shell(`<section class="m4-panel"><div class="m4-kicker">Final material studio</div><h1 class="m4-title">Create one material that earns its place.</h1><p class="m4-sub">Your commission: a one-page job aid for the generator safety check. Activate the three final approvals.</p><div class="m4-final-preview"><div class="m4-kicker" style="color:#168f7d">Field job aid</div><h2>Before starting the generator</h2><div class="callout"><b>1.</b> Inspect the fuel line</div><div class="callout"><b>2.</b> Clear the ventilation area</div><div class="callout"><b>3.</b> Confirm emergency shut-off access</div><p style="margin-top:18px;font-size:13px">Icons: licensed set · Source recorded in material notes</p></div><div class="m4-checks">${checks.map(([a,b])=>`<button class="m4-check ${S.checks.includes(a)?'ok':''}" onclick="m4Toggle('checks','${a}')">${S.checks.includes(a)?'✓ ':''}${a}: ${b}</button>`).join('')}</div>${S.checks.length===3?`<div class="m4-feedback"><b>Material approved.</b> It is clear, accessible, fit for purpose and properly credited.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Go(10)">Deliver to Elias</button></div>`:''}</section>`)}

 function end(){shell(`<section class="m4-panel"><div class="m4-kicker">Elias · Workshop review</div><h1 class="m4-title">“Good material disappears.<br>The learner sees the message.”</h1><p class="m4-sub">You resisted decoration for its own sake. You designed around attention, access, context and professional respect.</p><div class="m4-grid three"><div class="m4-card good"><div class="m4-icon">◫</div><h3>Clear</h3><p>One message, few words, readable in seconds.</p></div><div class="m4-card good"><div class="m4-icon">◎</div><h3>Accessible</h3><p>Usable across learners, devices and settings.</p></div><div class="m4-card good"><div class="m4-icon">©</div><h3>Respectful</h3><p>Licensed responsibly and credited properly.</p></div></div><div class="m4-quote">The strongest training tool is not the most impressive one. It is the simplest one that helps the learner succeed.</div><div class="m4-actions"><button class="m4-btn" onclick="m4Reset()">Replay Module 4</button></div><div class="m4-actions"><button class="m4-btn" onclick="__courseDone(3)">⚔ Take the Workshop Challenge</button></div></section>`)}

 function route(){[intro,broken,principles,clarity,access,rights,resources,tools,simplest,finalstudio,end][S.step]()}
 window.startModule4=route;
 
})();
</script>
<script>
/* ============ SYNTHESIZED SOUND LAYER ============ */
let AC=null, MUTED=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
document.addEventListener("pointerdown",()=>{ const c=ac(); if(c&&c.state==="suspended") c.resume(); },{once:false});
function tone(freq,dur,type,vol,when,slide){
  const c=ac(); if(!c||MUTED) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,c.currentTime+(when||0));
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+(when||0)+dur);
  g.gain.setValueAtTime(0.0001,c.currentTime+(when||0));
  g.gain.exponentialRampToValueAtTime(vol||.08,c.currentTime+(when||0)+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+(when||0)+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+(when||0)); o.stop(c.currentTime+(when||0)+dur+.05);
}
const sfx={
  tap:  ()=>tone(700,.05,"sine",.05),
  good: ()=>{tone(660,.09,"triangle",.09);tone(990,.14,"triangle",.09,.08);},
  mid:  ()=>tone(520,.12,"triangle",.07),
  bad:  ()=>tone(240,.2,"sawtooth",.06,0,150),
  fly:  ()=>tone(320,.5,"sine",.05,0,640),
  world:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.13,"triangle",.09,i*.11)),
  finale:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.16,"triangle",.1,i*.12));
              [262,330,392].forEach(f=>tone(f,.9,"sine",.05,.65));}
};
/* generic UI tap */
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest("button")) sfx.tap(); });
/* ambient bed: rolling ocean + high wind + soft pad — fully synthesized, zero files */
let AMB=null;
function startAmbience(){
  const c=ac(); if(!c||AMB) return;
  AMB=c.createGain(); AMB.gain.value=MUTED?0:1; AMB.connect(c.destination);
  const buf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const mk=(type,freq,q,vol,lfoHz,lfoAmt)=>{
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=c.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(AMB); src.start();
    if(lfoHz){ const o=c.createOscillator(), og=c.createGain();
      o.frequency.value=lfoHz; og.gain.value=lfoAmt; o.connect(og); og.connect(g.gain); o.start(); }
  };
  mk("lowpass",320,0.8,.05,.07,.028);   /* rolling waves */
  mk("bandpass",760,0.6,.012,.045,.007);/* high wind through the pines */
  const pad=c.createGain(); pad.gain.value=.011;
  const pf=c.createBiquadFilter(); pf.type="lowpass"; pf.frequency.value=680;
  pad.connect(pf); pf.connect(AMB);
  [110,165.3,220.6].forEach(fr=>{const o=c.createOscillator();o.type="sine";o.frequency.value=fr;o.connect(pad);o.start();});
}
document.addEventListener("pointerdown",()=>startAmbience(),{once:true});

window.__cardCourse = function(i){
  var cards = (window.__COURSE_CARDS && window.__COURSE_CARDS[i]) || [];
  var w = (window.WORLDS && window.WORLDS[i]) || {};
  var ov=null;
  function finish(){
    if(ov&&ov._key){document.removeEventListener('keydown',ov._key);}
    var el=document.getElementById('cardCourseOverlay');
    if(el&&el.parentNode)el.parentNode.removeChild(el);
    try{if(window.S)S.worldIdx=i;}catch(e){}
    if(i<4){if(typeof startCourse==='function')return startCourse(i);}
    if(typeof __courseDone==='function')return __courseDone(i);
    if(typeof enterWorld==='function')return enterWorld(i);
  }
  if(!cards.length)return finish();
  function esc(s){return (''+s);}
  var idx=0;
  ov=document.createElement('div');ov.id='cardCourseOverlay';
  document.body.appendChild(ov);
  function render(){
    var c=cards[idx];var last=idx===cards.length-1;
    var pct=Math.round((idx+1)/cards.length*100);
    ov.innerHTML=
      '<div class="cc-bar"><div class="cc-top">'+esc(w.icon||'')+' '+esc(w.module||'')+'</div>'
      +'<div class="cc-title">'+esc(w.title||'')+'</div>'
      +'<div class="cc-prog"><i style="width:'+pct+'%"></i></div></div>'
      +'<div class="cc-stage"><div class="cc-card" data-k="'+idx+'">'
      +'<div class="cc-kick">'+esc(c.k||'LESSON')+'</div>'
      +'<div class="cc-h">'+esc(c.t||'')+'</div>'
      +'<div class="cc-p">'+esc(c.p||'')+'</div>'
      +(c.d?'<div class="cc-d">'+esc(c.d)+'</div>':'')
      +(c.e?'<div class="cc-e"><b>Example</b> — '+esc(c.e)+'</div>':'')
      +'</div></div>'
      +'<div class="cc-foot"><div class="cc-count">'+(idx+1)+' / '+cards.length+'</div>'
      +'<div class="cc-btns"><button class="cc-back"'+(idx===0?' disabled':'')+'>◂ Back</button>'
      +'<button class="cc-next">'+(last?(i<4?'Continue to the lesson ▸':'Begin challenges ▸'):'Next ▸')+'</button></div></div>';
    ov.querySelector('.cc-next').addEventListener('click',function(){if(last){finish();}else{idx++;render();}});
    var b=ov.querySelector('.cc-back');if(b)b.addEventListener('click',function(){if(idx>0){idx--;render();}});
  }
  render();
  ov._key=function(e){
    if(e.key==='ArrowRight'){var n=ov.querySelector('.cc-next');if(n)n.click();}
    else if(e.key==='ArrowLeft'){var bk=ov.querySelector('.cc-back');if(bk&&!bk.disabled)bk.click();}
  };
  document.addEventListener('keydown',ov._key);
};
</script>

<script id="ccEnhance">
(function(){var T=window.THREE;var tries=0;var iv=setInterval(function(){tries++;var cap=window.__cap;
if((!cap||!cap.renderer||!cap.scene)&&tries<250)return;
/* Prefer waiting for Froggy meshes so fog/background match the ocean map. */
if(!(window.__islandMeshes&&window.__islandMeshes.length)&&tries<80)return;
clearInterval(iv); if(!cap||!cap.renderer||!cap.scene)return;
try{apply(cap);}catch(e){if(window.console)console.warn("enh",e);}},120);
function apply(cap){var r=cap.renderer,sc=cap.scene,cam=cap.camera;
try{r.shadowMap.enabled=true; if(T.PCFSoftShadowMap!==undefined)r.shadowMap.type=T.PCFSoftShadowMap;
(cap.dirLights||[]).forEach(function(l){try{if(l.castShadow&&l.shadow){l.shadow.mapSize.width=2048;l.shadow.mapSize.height=2048;l.shadow.bias=-0.0004;l.shadow.normalBias=0.02;if(l.shadow.map){l.shadow.map.dispose();l.shadow.map=null;}}}catch(e){}});}catch(e){}
try{
  if(window.__islandMeshes && window.__islandMeshes.length){
    sc.fog=new T.Fog(0x8FA8B0,90,420);
    if(!sc.background) sc.background=new T.Color(0x9BB4BC);
  }else{
    var far=(cam&&cam.far&&isFinite(cam.far))?cam.far:2000; sc.fog=new T.Fog(0x223140,far*0.22,far*0.96);
  }
}catch(e){}
try{if(T.HemisphereLight){var h=new T.HemisphereLight(0x9fc2e0,0x223038,0.28);sc.add(h);}}catch(e){}
try{if(cap.water&&cap.water.material&&cap.water.material.uniforms){var u=cap.water.material.uniforms;if(u.distortionScale)u.distortionScale.value=Math.max(u.distortionScale.value||0,4.5);if(u.size)u.size.value=(u.size.value||1)*1.1;}}catch(e){}
try{if(cap.bloom){if(cap.bloom.strength!=null)cap.bloom.strength*=1.22;if(cap.bloom.radius!=null)cap.bloom.radius=Math.min((cap.bloom.radius||0)+0.08,1);}}catch(e){}
try{addGrade(cap);}catch(e){} try{addParticles(cap);}catch(e){}}
function addGrade(cap){if(!cap.composer||!T.ShaderPass)return;var shader={uniforms:{tDiffuse:{value:null}},
vertexShader:"varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
fragmentShader:"uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); vec3 col=c.rgb; float l=dot(col,vec3(0.299,0.587,0.114)); col=mix(vec3(l),col,0.9); col*=vec3(0.95,1.0,1.09); col=(col-0.5)*1.09+0.5; vec2 p=vUv-0.5; float vg=1.0-dot(p,p)*0.6; col*=vg; gl_FragColor=vec4(clamp(col,0.0,1.0),c.a); }"};
var pass=new T.ShaderPass(shader);(cap.composer.passes||[]).forEach(function(p){try{p.renderToScreen=false;}catch(e){}});pass.renderToScreen=true;cap.composer.addPass(pass);}
function addParticles(cap){var sc=cap.scene,cam=cap.camera;if(!sc)return;var N=360,g=new T.BufferGeometry(),pos=new Float32Array(N*3),spd=new Float32Array(N);var R=(cam&&cam.far)?Math.min(cam.far*0.12,600):240;
for(var i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*R*2;pos[i*3+1]=Math.random()*R;pos[i*3+2]=(Math.random()-0.5)*R*2;spd[i]=0.2+Math.random()*0.7;}
g.setAttribute("position",new T.BufferAttribute(pos,3));var m=new T.PointsMaterial({color:0xbfe0ff,size:R*0.007,transparent:true,opacity:0.5,depthWrite:false,blending:T.AdditiveBlending});
var pts=new T.Points(g,m);pts.frustumCulled=false;sc.add(pts);var t0=performance.now();
function tick(){var a=g.attributes.position.array;var t=(performance.now()-t0)*0.001;for(var i=0;i<N;i++){a[i*3+1]+=spd[i]*0.12;if(a[i*3+1]>R)a[i*3+1]=0;a[i*3]+=Math.sin(t+i)*0.02;}if(cam){pts.position.set(cam.position.x,0,cam.position.z);}g.attributes.position.needsUpdate=true;requestAnimationFrame(tick);}requestAnimationFrame(tick);}
})();
</script>

<script id="ccScenery">
/* ============================================================================
   FROM EXPERT TO EDUCATOR — dress the island with uploaded GLB models.
   Scatters real low-poly TREES and ROCKS directly onto the island surface
   (raycast onto the terrain), and nothing else. Loads from assets/ (Draco),
   uses the scene captured by ccCapture. Tuning knobs are in CFG.
   ============================================================================ */
(function(){
  var T = window.THREE;
  if(!T || !T.GLTFLoader) return;
  /* Scenery planting is handled by mountNature() (Poly Haven firs + CDN rocks)
     with raycast settle onto Froggy Island. Skip this second planter to avoid
     a double forest once assets/trees.glb and assets/rocks.glb are present. */
  return;

  var CFG = {
    trees:{ count:44, size:5.5, rotX:-90 },
    rocks:{ count:20, size:3.6, rotX:0  },
    minR:6, maxR:42,          // horizontal spread; froggy island's rim is at ~46
    minY:1.5, maxY:40         // between shoreline and tree-line (skip sea and the summit)
  };

  var L = new T.GLTFLoader();
  if(T.DRACOLoader){ var D=new T.DRACOLoader(); D.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/"); L.setDRACOLoader(D); }
  function load(name){ return new Promise(function(res){ L.load("assets/"+name, function(g){res(g.scene);}, undefined, function(e){ if(window.console)console.warn("scenery:",name,e); res(null); }); }); }

  // normalise -> unit horizontal footprint, base sitting at y=0
  function template(root, rotXdeg){
    var g=new T.Group(); g.add(root);
    root.rotation.x = rotXdeg*Math.PI/180;
    g.updateMatrixWorld(true);
    var s=new T.Box3().setFromObject(g).getSize(new T.Vector3());
    var foot=Math.max(s.x, s.z)||Math.max(s.x,s.y,s.z)||1;
    root.scale.multiplyScalar(1/foot);
    g.updateMatrixWorld(true);
    var min=new T.Box3().setFromObject(g).min;
    root.position.y -= min.y;
    g.traverse(function(o){ if(o.isMesh){ o.receiveShadow=true; if(o.material&&'fog' in o.material) o.material.fog=true; } });
    return g;
  }

  // The island is now one named GLB rather than dozens of procedural meshes, so
  // target it directly. The old size/-distance heuristic would happily have
  // planted pine trees on the tents and the lighthouse roof.
  var tries=0, iv=setInterval(function(){
    tries++; var cap=window.__cap;
    if(cap && cap.scene && window.__islandMeshes && window.__islandMeshes.length){
      clearInterval(iv); run(cap.scene, window.__islandMeshes); return;
    }
    if(tries>500){ clearInterval(iv); if(window.console) console.warn("scenery: island never arrived"); }
  }, 200);

  function run(scene, island){
    var SG=new T.Group(); SG.name="islandScenery"; scene.add(SG);
    var ray=new T.Raycaster(), down=new T.Vector3(0,-1,0), from=new T.Vector3();
    function surface(x,z){ from.set(x,300,z); ray.set(from,down); var h=ray.intersectObjects(island,true); return h.length?h[0].point.y:null; }
    function plant(tmpl,size,sink){
      for(var t=0;t<40;t++){
        var a=Math.random()*Math.PI*2, r=CFG.minR+Math.random()*(CFG.maxR-CFG.minR);
        var x=Math.cos(a)*r, z=Math.sin(a)*r, y=surface(x,z);
        if(y===null || y<CFG.minY || y>CFG.maxY) continue;
        var c=tmpl.clone(true); c.scale.setScalar(size*(0.75+Math.random()*0.6));
        c.position.set(x, y-(sink||0), z); c.rotation.y=Math.random()*6.28; SG.add(c);
        return true;
      }
      return false;
    }
    Promise.all([load("trees.glb"),load("rocks.glb")]).then(function(r){
      var trees=r[0]&&template(r[0],CFG.trees.rotX);
      var rocks=r[1]&&template(r[1],CFG.rocks.rotX);
      var i;
      if(trees) for(i=0;i<CFG.trees.count;i++) plant(trees, CFG.trees.size, 0.3);
      if(rocks) for(i=0;i<CFG.rocks.count;i++) plant(rocks, CFG.rocks.size, 0.2);
      if(window.console) console.log("island scenery:", SG.children.length, "objects");
    });
  }
})();

</script>
